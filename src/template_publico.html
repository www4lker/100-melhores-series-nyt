<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Os 100 melhores programas de TV do século XXI</title>
<meta name="description" content="A lista do The New York Times com os 100 melhores programas de TV do século XXI, em português, com fichas e resenhas de __NFICHAS__ séries. Marque o que já viu e o que quer ver.">
<style>
:root{
  --paper:#f4efe4; --paper2:#ebe4d4; --ink:#1d1b17; --ink2:#5b564b; --rule:#cfc6b2;
  --blue:#1f3a5f; --green:#2f6b3a; --amber:#9a5b05; --red:#a3271c; --card:#fbf8f0;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#17150f; --paper2:#201d15; --ink:#ece6d6; --ink2:#a39b88; --rule:#3a3528;
  --blue:#8fb2e6; --green:#7cc58a; --amber:#e0a14a; --red:#ee7d70; --card:#1d1a12}
}
:root[data-theme="dark"]{--paper:#17150f; --paper2:#201d15; --ink:#ece6d6; --ink2:#a39b88; --rule:#3a3528;
  --blue:#8fb2e6; --green:#7cc58a; --amber:#e0a14a; --red:#ee7d70; --card:#1d1a12}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans)}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
/* topo */
header.top{padding:14px 16px 10px;border-bottom:2px solid var(--ink);display:grid;gap:10px}
.titlebar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
h1{font:700 clamp(20px,3.2vw,28px)/1.1 var(--serif);margin:0;letter-spacing:-.01em}
h1 small{display:block;font:400 13px/1.35 var(--sans);color:var(--ink2);margin-top:5px;letter-spacing:0}
.counts{display:flex;flex-wrap:wrap;gap:4px 16px;font:12px var(--mono);color:var(--ink2)}
.counts b{color:var(--ink);font-weight:700}
.bar{height:6px;background:var(--paper2);border:1px solid var(--rule);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--green);width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--ink);background:var(--card);border-radius:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--ink);background:transparent;padding:5px 9px;font:12px var(--mono);cursor:pointer;border-radius:0}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--ink);background:var(--card);padding:5px 10px;font:12px var(--mono);cursor:pointer;border-radius:0}
.btn:hover{background:var(--paper2)}
/* layout */
main{display:grid;grid-template-columns:minmax(360px,40%) 1fr;min-height:calc(100vh - 140px)}
#list{border-right:1px solid var(--ink);max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:0;align-self:start}
.lhead,.row{display:grid;grid-template-columns:38px 1fr 28px 28px;gap:6px;align-items:center;padding:7px 10px}
.lhead{position:sticky;top:0;background:var(--paper2);border-bottom:1px solid var(--ink);font:10px var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;z-index:2}
.lhead span:nth-child(n+3){text-align:center}
.row{border-bottom:1px solid var(--rule);cursor:pointer;background:transparent}
.row:hover{background:var(--paper2)}
.row[aria-selected=true]{background:var(--card);box-shadow:inset 4px 0 0 var(--blue)}
.rk{font:700 17px var(--mono);text-align:right;color:var(--ink2)}
.tt{min-width:0}
.tt .pt{font:700 15px/1.2 var(--serif);display:block}
.tt .en{font:11px var(--mono);color:var(--ink2);display:block;margin-top:2px}
.tt .yr{font:11px var(--mono);color:var(--ink2)}
.stamp{display:inline-block;border:1.5px solid currentColor;padding:0 4px;margin-left:6px;font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;color:var(--green);vertical-align:1px}
.row input[type=checkbox]{width:18px;height:18px;margin:0 auto;display:block;accent-color:var(--blue);cursor:pointer}
.empty{padding:24px 14px;color:var(--ink2);font:13px var(--mono)}
/* detalhe */
#detail{padding:18px clamp(14px,3vw,32px) 60px;min-width:0}
.d-rank{font:700 12px var(--mono);color:var(--ink2);letter-spacing:.06em}
.d-title{font:700 clamp(24px,3.4vw,36px)/1.08 var(--serif);margin:2px 0 4px;letter-spacing:-.01em}
.d-sub{font:13px var(--mono);color:var(--ink2);margin:0 0 8px}
.tagline{font:italic 400 clamp(16px,2vw,19px)/1.4 var(--serif);margin:0 0 14px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--ink);margin:12px 0}
.card h3{margin:0;padding:5px 10px;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--ink);background:var(--paper2);display:flex;justify-content:space-between;gap:8px}
dl.f{display:grid;grid-template-columns:max-content 1fr;margin:0}
dl.f dt,dl.f dd{margin:0;padding:5px 10px;border-bottom:1px solid var(--rule)}
dl.f dt{font:11px var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;padding-right:14px}
dl.f dd{font-size:14px}
dl.f > :nth-last-child(-n+2){border-bottom:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px}
.checks label{display:flex;gap:7px;align-items:center;font:13px var(--mono);cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--blue)}
textarea.note{width:calc(100% - 20px);margin:0 10px 10px;min-height:56px;padding:6px 8px;border:1px solid var(--rule);background:var(--paper);resize:vertical;font-size:14px}
.txt{padding:14px clamp(12px,3vw,26px);font:16px/1.65 var(--serif);max-width:72ch}
.txt p{margin:0 0 .85em}
.txt p:last-child{margin-bottom:0}
.txt #more{margin-top:.85em}
.txt #more[hidden]{display:none}
.more-btn{margin-top:12px}
.d-links{margin:4px 0 0;font:12px var(--mono)}
.d-links a{color:var(--blue)}
.nav{display:flex;gap:6px;margin:0 0 12px}
.none{padding:14px 12px;font-size:14px;max-width:62ch}
.none b{font-family:var(--serif)}
.backbtn{display:none}
.foot{padding:16px;border-top:1px solid var(--rule);font:12px/1.55 var(--sans);color:var(--ink2);max-width:90ch}
.foot p{margin:0 0 .6em}
@media (max-width:900px){
  main{grid-template-columns:1fr}
  #list{max-height:none;position:static;border-right:0}
  #detail{display:none;position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;padding-top:10px}
  body.showdetail #detail{display:block}
  body.showdetail{overflow:hidden}
  .backbtn{display:inline-block}
  .lhead,.row{grid-template-columns:34px 1fr 26px 26px;gap:4px;padding:7px 8px}
  dl.f{grid-template-columns:1fr}
  dl.f dt{border-bottom:0;padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.tools,#list,.nav,.checks{display:none}main{display:block}#detail{display:block}}
</style>
</head>
<body>
<header class="top">
  <div class="titlebar">
    <h1>Os 100 melhores programas de TV do século XXI<small>A lista do jornal <i>The New York Times</i>, em português. __NFICHAS__ séries já têm ficha e resenha, as demais estão em preparação; marque o que já viu e o que quer ver.</small></h1>
    <div class="counts" id="counts" aria-live="polite"></div>
  </div>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  <div class="tools" role="search">
    <input type="search" id="q" placeholder="Buscar título, ano, ator, assunto…  ( / )" aria-label="Buscar">
    <div class="chips" id="chips" role="group" aria-label="Filtros"></div>
    <button class="btn" id="btnExport" title="Baixar suas marcações num arquivo">Exportar marcações</button>
    <button class="btn" id="btnImport" title="Carregar marcações exportadas antes">Importar</button>
    <input type="file" id="fileImport" accept="application/json" hidden>
  </div>
</header>
<main>
  <section id="list" aria-label="Lista na ordem do NYT">
    <div class="lhead" role="row"><span>Nº</span><span>Título</span><span title="Já vi">Vi</span><span title="Quero ver">Qv</span></div>
    <div id="rows" role="listbox" aria-label="Programas"></div>
  </section>
  <article id="detail" aria-live="polite"></article>
</main>
<footer class="foot" id="foot"></footer>

<script id="dados" type="application/json">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('dados').textContent);
const ITEMS = D.items;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---- marcações do leitor (ficam só neste navegador) ---- */
const KEY='nyt100-br:v1';
let ST={};
try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ST={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
const get=(r,k)=>!!(ST[r]&&ST[r][k]);
function setv(r,k,v){ST[r]=ST[r]||{};if(v)ST[r][k]=v;else delete ST[r][k];if(!Object.keys(ST[r]).length)delete ST[r];save();}

/* ---- filtros ---- */
const FILTERS=[
 ['todos','Todos',()=>true],
 ['ficha','Com ficha',i=>!!i.ficha],
 ['nvi','Ainda não vi',i=>!get(i.rank,'v')],
 ['vi','Já vi',i=>get(i.rank,'v')],
 ['qv','Quero ver',i=>get(i.rank,'q')],
];
let filt='todos', query='', sel=1;
const chips=$('#chips');
FILTERS.forEach(([id,label])=>{const b=document.createElement('button');b.className='chip';b.dataset.f=id;b.textContent=label;b.setAttribute('aria-pressed',id===filt);
  b.onclick=()=>{filt=id;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===filt));renderList()};chips.appendChild(b)});

const hay = i => norm([i.rank,i.pt,i.nyt,i.alt,i.anos,i.ficha&&[i.ficha.tagline,i.ficha.genero,i.ficha.pais,i.ficha.elenco,i.ficha.emissora,i.ficha.parecido,i.ficha.texto.join(' ')].join(' ')].join(' '));
ITEMS.forEach(i=>i._h=hay(i));

function visible(){
  const f=FILTERS.find(x=>x[0]===filt)[2], q=norm(query).trim();
  return ITEMS.filter(i=>f(i)&&(!q||i._h.includes(q)));
}

/* ---- lista ---- */
function renderList(){
  const v=visible(), box=$('#rows');
  if(!v.length){box.innerHTML='<div class="empty">Nenhum programa neste filtro.</div>';counts();return}
  box.innerHTML=v.map(i=>`
   <div class="row" role="option" tabindex="-1" data-r="${i.rank}" aria-selected="${i.rank===sel}">
     <span class="rk">${i.rank}</span>
     <span class="tt"><span class="pt">${esc(i.pt)}</span>${i.pt!==i.nyt?`<span class="en">${esc(i.nyt)}</span>`:''}<span class="yr">${esc(i.anos)}</span>${i.ficha?'<span class="stamp" title="Tem ficha e resenha">ficha</span>':''}</span>
     <input type="checkbox" data-k="v" aria-label="Já vi: ${esc(i.pt)}" ${get(i.rank,'v')?'checked':''}>
     <input type="checkbox" data-k="q" aria-label="Quero ver: ${esc(i.pt)}" ${get(i.rank,'q')?'checked':''}>
   </div>`).join('');
  counts();
}
$('#rows').addEventListener('click',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  const r=+row.dataset.r;
  if(e.target.matches('input[type=checkbox]')){setv(r,e.target.dataset.k,e.target.checked);syncDetailChecks(r);counts();return}
  select(r,true);
});
function counts(){
  const n=ITEMS.length;
  const v=ITEMS.filter(i=>get(i.rank,'v')).length, q=ITEMS.filter(i=>get(i.rank,'q')).length;
  $('#counts').innerHTML=`<span><b>${v}</b> de ${n} vistos</span><span><b>${q}</b> quero ver</span><span>mostrando <b>${visible().length}</b></span>`;
  $('#barfill').style.width=(v/n*100)+'%';
}

/* ---- detalhe ---- */
function f(dt,dd){return dd?`<dt>${dt}</dt><dd>${dd}</dd>`:''}
/* resenha: até 2 parágrafos aparecem inteiros; com mais de 2, só o 1º aparece e o resto fica atrás de "Ler mais" */
function corpo(P){
  const par=a=>a.map(p=>`<p>${esc(p)}</p>`).join('');
  if(P.length<=2) return par(P);
  return par(P.slice(0,1))+`<div id="more" hidden>${par(P.slice(1))}</div><button class="btn more-btn" id="morebtn" aria-expanded="false" aria-controls="more">Ler mais</button>`;
}
function select(r,open){
  sel=r; const i=ITEMS.find(x=>x.rank===r); if(!i) return;
  [...document.querySelectorAll('.row')].forEach(el=>el.setAttribute('aria-selected',+el.dataset.r===r));
  const F=i.ficha;
  const sub=[i.pt!==i.nyt?`Título original: ${esc(i.nyt)}`:'', esc(i.anos)].filter(Boolean).join(' · ');
  let h=`<div class="nav"><button class="btn backbtn" id="back">← lista</button><button class="btn" id="prev">← anterior</button><button class="btn" id="next">próximo →</button></div>
   <div class="d-rank">Nº ${i.rank} DE 100 · NYT</div>
   <h2 class="d-title">${esc(i.pt)}</h2>
   <p class="d-sub">${sub}</p>
   <p class="d-links"><a href="${esc(i.imdb)}" target="_blank" rel="noopener noreferrer">Buscar no IMDb ↗</a></p>
   ${F?`<p class="tagline">${esc(F.tagline)}</p>`:''}
   <div class="card"><h3><span>Minhas marcações</span><span id="ckst"></span></h3>
    <div class="checks">
     <label><input type="checkbox" data-k="v" ${get(i.rank,'v')?'checked':''}> Já vi</label>
     <label><input type="checkbox" data-k="q" ${get(i.rank,'q')?'checked':''}> Quero ver</label>
    </div>
    <textarea class="note" id="note" placeholder="Anotação pessoal…" aria-label="Anotação">${esc((ST[i.rank]||{}).n||'')}</textarea>
   </div>`;
  if(F){
    h+=`<div class="card"><h3><span>Ficha</span></h3><dl class="f">
      ${f('Gênero',esc(F.genero))}${f('País',esc(F.pais))}${f('Exibição',esc(F.anos))}${f('Elenco',esc(F.elenco))}
      ${f('Emissora original',esc(F.emissora))}${f('Prêmios',esc(F.premios))}${f('Para quem gosta de',esc(F.parecido))}${f('Episódio de destaque',esc(F.episodio))}${f('Também conhecida como',esc(i.alt))}
     </dl></div>
     <div class="card"><h3><span>Sobre a série</span></h3><div class="txt">${corpo(F.texto)}</div></div>`;
  }else{
    h+=`<div class="card"><h3><span>Sobre a série</span></h3><div class="none"><b>Ficha em preparação.</b><br>Por enquanto esta página traz só a posição na lista do NYT, o título e os anos de exibição.${i.alt?`<br><br>Também conhecida como: ${esc(i.alt)}.`:''}</div></div>`;
  }
  $('#detail').innerHTML=h;
  $('#detail').scrollTop=0; if(open){document.body.classList.add('showdetail');window.scrollTo(0,0)}
  try{history.replaceState(null,'','#'+r)}catch(e){}
  ckst(i.rank);
}
function ckst(r){const el=$('#ckst'); if(el) el.textContent=[get(r,'v')?'visto':'',get(r,'q')?'quero ver':''].filter(Boolean).join(' · ')}
$('#detail').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='back') document.body.classList.remove('showdetail');
  else if(t.id==='prev') step(-1); else if(t.id==='next') step(1);
  else if(t.id==='morebtn'){const m=$('#more'),abrir=m.hidden;m.hidden=!abrir;t.setAttribute('aria-expanded',abrir);t.textContent=abrir?'Ler menos':'Ler mais'}
});
$('#detail').addEventListener('change',e=>{
  if(e.target.matches('input[type=checkbox][data-k]')){setv(sel,e.target.dataset.k,e.target.checked);const row=$(`.row[data-r="${sel}"] input[data-k="${e.target.dataset.k}"]`);if(row)row.checked=e.target.checked;ckst(sel);counts();if(['nvi','vi','qv'].includes(filt))renderList()}
});
$('#detail').addEventListener('input',e=>{if(e.target.id==='note'){setv(sel,'n',e.target.value.trim()?e.target.value:'')}});
function syncDetailChecks(r){if(r!==sel)return;document.querySelectorAll('#detail .checks input').forEach(c=>c.checked=get(r,c.dataset.k));ckst(r)}
function step(d){const v=visible();const k=v.findIndex(x=>x.rank===sel);const n=v[Math.min(v.length-1,Math.max(0,k+d))];if(n){select(n.rank);const row=$(`.row[data-r="${n.rank}"]`);if(row)row.scrollIntoView({block:'nearest'})}}

/* ---- busca, atalhos ---- */
$('#q').addEventListener('input',e=>{query=e.target.value;renderList()});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
  if(e.key==='/'&&!typing){e.preventDefault();$('#q').focus();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='j'||e.key==='ArrowDown'){e.preventDefault();step(1)}
  else if(e.key==='k'||e.key==='ArrowUp'){e.preventDefault();step(-1)}
  else if(e.key==='Escape'){document.body.classList.remove('showdetail')}
});

/* ---- exportar / importar marcações ---- */
function download(name,mime,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('#btnExport').onclick=()=>download('nyt100-marcacoes.json','application/json',JSON.stringify({versao:1,estado:ST},null,1));
$('#btnImport').onclick=()=>$('#fileImport').click();
$('#fileImport').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o&&o.estado&&typeof o.estado==='object'){ST=o.estado;save();renderList();select(sel)}else alert('Arquivo inválido.')}catch(x){alert('Arquivo inválido.')}});e.target.value=''};

/* ---- rodapé ---- */
$('#foot').innerHTML=D.rodape.map(p=>`<p>${esc(p)}</p>`).join('');

/* ---- início ---- */
renderList();
const h0=parseInt((location.hash||'').slice(1),10);
select(ITEMS.some(i=>i.rank===h0)?h0:1,false);
window.addEventListener('hashchange',()=>{const h=parseInt((location.hash||'').slice(1),10); if(ITEMS.some(i=>i.rank===h)&&h!==sel) select(h,false);});
</script>
</body>
</html>
