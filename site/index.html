<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Os 100 melhores programas de TV do século XXI</title>
<meta name="description" content="A lista do The New York Times com os 100 melhores programas de TV do século XXI, em português, com fichas e resenhas de 56 séries. Marque o que já viu e o que quer ver.">
<style>
:root{
  --paper:#f4efe4; --paper2:#ebe4d4; --ink:#1d1b17; --ink2:#5b564b; --rule:#cfc6b2;
  --blue:#1f3a5f; --green:#2f6b3a; --amber:#9a5b05; --red:#a3271c; --card:#fbf8f0;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#17150f; --paper2:#201d15; --ink:#ece6d6; --ink2:#a39b88; --rule:#3a3528;
  --blue:#8fb2e6; --green:#7cc58a; --amber:#e0a14a; --red:#ee7d70; --card:#1d1a12}
}
:root[data-theme="dark"]{--paper:#17150f; --paper2:#201d15; --ink:#ece6d6; --ink2:#a39b88; --rule:#3a3528;
  --blue:#8fb2e6; --green:#7cc58a; --amber:#e0a14a; --red:#ee7d70; --card:#1d1a12}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans)}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
/* topo */
header.top{padding:14px 16px 10px;border-bottom:2px solid var(--ink);display:grid;gap:10px}
.titlebar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
h1{font:700 clamp(20px,3.2vw,28px)/1.1 var(--serif);margin:0;letter-spacing:-.01em}
h1 small{display:block;font:400 13px/1.35 var(--sans);color:var(--ink2);margin-top:5px;letter-spacing:0}
.counts{display:flex;flex-wrap:wrap;gap:4px 16px;font:12px var(--mono);color:var(--ink2)}
.counts b{color:var(--ink);font-weight:700}
.bar{height:6px;background:var(--paper2);border:1px solid var(--rule);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--green);width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--ink);background:var(--card);border-radius:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--ink);background:transparent;padding:5px 9px;font:12px var(--mono);cursor:pointer;border-radius:0}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--ink);background:var(--card);padding:5px 10px;font:12px var(--mono);cursor:pointer;border-radius:0}
.btn:hover{background:var(--paper2)}
/* layout */
main{display:grid;grid-template-columns:minmax(360px,40%) 1fr;min-height:calc(100vh - 140px)}
#list{border-right:1px solid var(--ink);max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:0;align-self:start}
.lhead,.row{display:grid;grid-template-columns:38px 1fr 28px 28px;gap:6px;align-items:center;padding:7px 10px}
.lhead{position:sticky;top:0;background:var(--paper2);border-bottom:1px solid var(--ink);font:10px var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;z-index:2}
.lhead span:nth-child(n+3){text-align:center}
.row{border-bottom:1px solid var(--rule);cursor:pointer;background:transparent}
.row:hover{background:var(--paper2)}
.row[aria-selected=true]{background:var(--card);box-shadow:inset 4px 0 0 var(--blue)}
.rk{font:700 17px var(--mono);text-align:right;color:var(--ink2)}
.tt{min-width:0}
.tt .pt{font:700 15px/1.2 var(--serif);display:block}
.tt .en{font:11px var(--mono);color:var(--ink2);display:block;margin-top:2px}
.tt .yr{font:11px var(--mono);color:var(--ink2)}
.stamp{display:inline-block;border:1.5px solid currentColor;padding:0 4px;margin-left:6px;font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;color:var(--green);vertical-align:1px}
.row input[type=checkbox]{width:18px;height:18px;margin:0 auto;display:block;accent-color:var(--blue);cursor:pointer}
.empty{padding:24px 14px;color:var(--ink2);font:13px var(--mono)}
/* detalhe */
#detail{padding:18px clamp(14px,3vw,32px) 60px;min-width:0}
.d-rank{font:700 12px var(--mono);color:var(--ink2);letter-spacing:.06em}
.d-title{font:700 clamp(24px,3.4vw,36px)/1.08 var(--serif);margin:2px 0 4px;letter-spacing:-.01em}
.d-sub{font:13px var(--mono);color:var(--ink2);margin:0 0 8px}
.tagline{font:italic 400 clamp(16px,2vw,19px)/1.4 var(--serif);margin:0 0 14px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--ink);margin:12px 0}
.card h3{margin:0;padding:5px 10px;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--ink);background:var(--paper2);display:flex;justify-content:space-between;gap:8px}
dl.f{display:grid;grid-template-columns:max-content 1fr;margin:0}
dl.f dt,dl.f dd{margin:0;padding:5px 10px;border-bottom:1px solid var(--rule)}
dl.f dt{font:11px var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;padding-right:14px}
dl.f dd{font-size:14px}
dl.f > :nth-last-child(-n+2){border-bottom:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px}
.checks label{display:flex;gap:7px;align-items:center;font:13px var(--mono);cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--blue)}
textarea.note{width:calc(100% - 20px);margin:0 10px 10px;min-height:56px;padding:6px 8px;border:1px solid var(--rule);background:var(--paper);resize:vertical;font-size:14px}
.txt{padding:14px clamp(12px,3vw,26px);font:16px/1.65 var(--serif);max-width:72ch}
.txt p{margin:0 0 .85em}
.txt p:last-child{margin-bottom:0}
.txt #more{margin-top:.85em}
.txt #more[hidden]{display:none}
.more-btn{margin-top:12px}
.d-links{margin:4px 0 0;font:12px var(--mono)}
.d-links a{color:var(--blue)}
.nav{display:flex;gap:6px;margin:0 0 12px}
.none{padding:14px 12px;font-size:14px;max-width:62ch}
.none b{font-family:var(--serif)}
.backbtn{display:none}
.foot{padding:16px;border-top:1px solid var(--rule);font:12px/1.55 var(--sans);color:var(--ink2);max-width:90ch}
.foot p{margin:0 0 .6em}
@media (max-width:900px){
  main{grid-template-columns:1fr}
  #list{max-height:none;position:static;border-right:0}
  #detail{display:none;position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;padding-top:10px}
  body.showdetail #detail{display:block}
  body.showdetail{overflow:hidden}
  .backbtn{display:inline-block}
  .lhead,.row{grid-template-columns:34px 1fr 26px 26px;gap:4px;padding:7px 8px}
  dl.f{grid-template-columns:1fr}
  dl.f dt{border-bottom:0;padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.tools,#list,.nav,.checks{display:none}main{display:block}#detail{display:block}}
</style>
</head>

<header class="top">
  <div class="titlebar">
    <h1>Os 100 melhores programas de TV do século XXI<small>A lista do jornal <i>The New York Times</i>, em português. 56 séries já têm ficha e resenha, as demais estão em preparação; marque o que já viu e o que quer ver.</small></h1>

</main>

<script id="dados" type="application/json">{"items": [{"rank": 1, "nyt": "Breaking Bad", "anos": "2008–2013", "pt": "Breaking Bad", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Breaking+Bad", "ficha": {"tagline": "Um professor de química comum vira, passo a passo, o pior de si mesmo.", "genero": "Drama policial", "pais": "Estados Unidos", "anos": "2008–2013 · 5 temporadas", "elenco": "Bryan Cranston, Aaron Paul, Anna Gunn, Dean Norris, Bob Odenkirk, Betsy Brandt, RJ Mitte, Giancarlo Esposito", "emissora": "AMC", "premios": "16 Emmys, incluindo melhor série dramática em 2013 e 2014; quatro Emmys de melhor ator para Bryan Cranston.", "parecido": "Família Soprano, Better Call Saul, Ozark", "episodio": "“Ozymandias” (5ª temporada, ep. 14) — veja só depois de chegar lá.", "texto": ["Walter White é professor de química numa escola de Albuquerque, no Novo México, e faz bico num lava-rápido para fechar as contas. Aos cinquenta anos, descobre um câncer de pulmão e percebe que a família ficará sem nada quando ele morrer. A saída que encontra é usar o que sabe de química para fabricar metanfetamina de qualidade excepcional, em parceria com Jesse Pinkman, um ex-aluno que já circula pelo mundo das drogas. O plano era ganhar o suficiente e sair de cena.", "O que a torna especial é a direção em que a história anda. Vince Gilligan, o criador, dizia querer transformar o professor bonachão de um filme clássico num gângster de cinema, e a série mostra isso com paciência, uma decisão de cada vez. Em vez de um homem bom empurrado para o crime, vemos orgulho, ressentimento e vaidade encontrando enfim um palco. Bryan Cranston, antes mais lembrado como o pai atrapalhado de uma comédia, faz um trabalho de precisão enorme, e Aaron Paul dá a Jesse a humanidade que contrabalança Walter. Os roteiros são tão bem amarrados que detalhes plantados cedo voltam, temporadas depois, com consequências.", "Estreou em 2008 no AMC, canal que então quase não fazia séries próprias, e foi crescendo até virar fenômeno. Ajudou a firmar a ideia de que a televisão pode contar uma história longa com começo, meio e fim planejados. Deu origem ao prólogo Better Call Saul (2015–2022), também nesta lista, e ao filme El Camino (2019).", "Serve a quem gosta de suspense bem construído e de personagens que desafiam a nossa simpatia. Não é para quem não suporta violência, tensão prolongada ou histórias em que tudo piora antes de melhorar. A série guarda revelações importantes, sobretudo da metade em diante, então vale fugir de resumos e comentários antes de ver. Comece pelo primeiro episódio: a 1ª temporada, mais curta que as outras, já mostra o rumo e dá para saber logo se a série é para você."]}}, {"rank": 2, "nyt": "The Wire", "anos": "2002–2008", "pt": "A Escuta", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=The+Wire", "ficha": {"tagline": "Baltimore vista de cima a baixo: da esquina do tráfico ao gabinete do prefeito.", "genero": "Drama policial", "pais": "Estados Unidos", "anos": "2002–2008 · 5 temporadas", "elenco": "Dominic West, Lance Reddick, Sonja Sohn, Wendell Pierce, Clarke Peters, Idris Elba, Michael K. Williams, Andre Royo, Wood Harris, Aidan Gillen", "emissora": "HBO", "premios": "Nunca ganhou um Emmy — omissão que virou símbolo de injustiça entre críticos e fãs.", "parecido": "Família Soprano, Deadwood, The Shield: Acima da Lei", "episodio": "“Middle Ground” (3ª temporada, ep. 11).", "texto": ["Em Baltimore, uma equipe de policiais recebe a missão de derrubar uma quadrilha do tráfico de drogas e começa a grampear telefones. A cada temporada, a câmera se afasta um pouco mais da esquina e passa a mostrar o resto da cidade: o porto, a prefeitura, as escolas públicas, a redação de um jornal. O fio que costura tudo é uma pergunta incômoda: por que as instituições americanas, com tanta gente competente dentro delas, falham tanto?", "David Simon, ex-repórter policial do jornal The Baltimore Sun, e Ed Burns, ex-detetive e depois professor, escreveram a série com o conhecimento de quem viu aquilo de perto, e isso se nota. Os diálogos são cheios de gíria e quase nunca explicam nada; os personagens, dezenas, não se dividem entre mocinhos e bandidos. Policiais cansados, traficantes com código de honra, políticos oportunistas e professores dedicados dividem o mesmo quadro, presos a sistemas maiores do que eles. Entre os mais lembrados estão o detetive McNulty, o estrategista Stringer Bell, de Idris Elba, e Omar, de Michael K. Williams, o assaltante que só rouba traficantes.", "Foi exibida pela HBO entre 2002 e 2008 e não foi grande sucesso de audiência na época. A fama veio depois, quando mais gente passou a descobri-la em maratona e ela virou presença constante em listas de melhor série de todos os tempos. Nunca ganhou um Emmy, o que se tornou símbolo de injustiça entre críticos e fãs, e seu jeito de retratar uma cidade inteira como um sistema influenciou muito do que veio depois.", "Serve a quem gosta de histórias longas e exigentes, para ver com atenção. Não é para quem busca ação rápida ou explicações pelo caminho: as primeiras horas pedem paciência, porque a série confia que você ligará os pontos sozinho, e essa confiança é a recompensa. Comece pelo primeiro episódio e siga a ordem, pois cada temporada muda de cenário mas só faz sentido pelo que veio antes. Muitos fãs veem na quarta, sobre as escolas, a mais devastadora."]}}, {"rank": 3, "nyt": "Mad Men", "anos": "2007–2015", "pt": "Mad Men: Inventando Verdades", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Mad+Men", "ficha": {"tagline": "Publicitários dos anos 1960 vendem o sonho americano e escondem o próprio pesadelo.", "genero": "Drama", "pais": "Estados Unidos", "anos": "2007–2015 · 7 temporadas", "elenco": "Jon Hamm, Elisabeth Moss, John Slattery, Vincent Kartheiser, January Jones, Christina Hendricks, Jared Harris, Robert Morse", "emissora": "AMC", "premios": "16 Emmys, incluindo quatro vezes seguidas o de melhor série dramática (2008–2011); Globo de Ouro de melhor série dramática em 2008, 2009 e 2010.", "parecido": "Halt and Catch Fire, Succession, The Americans: Rede de Espionagem", "episodio": "“The Suitcase” (4ª temporada, ep. 7).", "texto": ["Nova York, 1960. Don Draper é o diretor de criação mais admirado da agência Sterling Cooper, na Madison Avenue: elegante, brilhante, com casa no subúrbio, esposa bonita e filhos. Mas “Don Draper” guarda segredos, e a imagem de sucesso é montada com cuidado para escondê-los. A série acompanha a agência e as pessoas que passam por ela ao longo dos anos 1960, enquanto a América dos cigarros acesos em qualquer sala e do uísque no meio do expediente vai dando lugar à dos direitos civis, da contracultura e do feminismo.", "Mad Men é lenta de propósito, e é aí que mora o seu encanto. As cenas se constroem de pausas, olhares e frases que dizem o contrário do que parecem, e a reconstituição de época — ternos, móveis, tipografia, o jeito de tratar as secretárias — é tão minuciosa que influenciou a moda e o design. Sob o verniz, a série trata de reinvenção, solidão e da distância entre a imagem que se vende e a vida que se tem. Jon Hamm segura o centro, mas ela é igualmente de Peggy Olson (Elisabeth Moss), que sobe de secretária a redatora num meio hostil às mulheres.", "Criada por Matthew Weiner, que antes escrevera para Família Soprano, estreou em 2007 no AMC, canal até então conhecido por filmes antigos. O sucesso dela, depois acompanhado pelo de Breaking Bad, fez do canal uma casa de dramas de prestígio. Levou o Emmy de melhor série dramática quatro anos seguidos e mostrou que um drama de época pode falar do presente sem fazer sermão.", "Serve a quem gosta de personagens complexos, de reconstituição de época e de histórias em que o drama mora nas pequenas coisas. Não é para quem espera reviravolta a cada episódio: o ritmo é contemplativo e o protagonista pode irritar. Há mudanças na vida dos personagens que valem ser descobertas por conta própria, então fuja de resumos. Comece pelo piloto, que já apresenta o mundo e o enigma de Don; a apresentação do carrossel, no fim da 1ª temporada, é uma das cenas mais citadas da TV."]}}, {"rank": 4, "nyt": "Succession", "anos": "2018–2023", "pt": "Succession", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Succession", "ficha": {"tagline": "Uma família bilionária disputa o trono do império — e ninguém sabe amar sem negociar.", "genero": "Drama com humor ácido", "pais": "Estados Unidos", "anos": "2018–2023 · 4 temporadas", "elenco": "Brian Cox, Jeremy Strong, Sarah Snook, Kieran Culkin, Alan Ruck, Matthew Macfadyen, Nicholas Braun, J. Smith-Cameron", "emissora": "HBO", "premios": "Emmy de melhor série dramática três vezes (2020, 2022 e 2024).", "parecido": "Veep, Mad Men: Inventando Verdades, The Thick of It", "episodio": "“Connor’s Wedding” (4ª temporada, ep. 9).", "texto": ["Logan Roy é o fundador de um conglomerado de mídia e já está velho demais para continuar no comando, mas não aceita largar o posto. Seus filhos adultos, entre eles Kendall, Shiv e Roman, disputam o direito de sucedê-lo, cada um do seu jeito e quase nunca às claras. O cenário é um mundo de conselhos de administração, jatos particulares e acordos bilionários, onde cada conversa de corredor vale uma guerra. Quem acompanha o noticiário vai reconhecer ecos de dinastias reais da imprensa, como a de Rupert Murdoch, mas a série é ficção e inventa o seu próprio clã.", "O que a torna especial é a mistura de comédia e tragédia. Jesse Armstrong, que escreveu para The Thick of It e cocriou Peep Show, faz diálogos cheios de insultos elaborados e humilhações precisas, tão engraçados que a gente ri e logo se sente mal por ter rido. Os personagens têm tudo, menos o que importa, e a série não pede que gostemos deles, só que não consigamos desviar o olhar. O elenco é afiadíssimo, com Brian Cox, Sarah Snook, Kieran Culkin e Jeremy Strong, e a câmera nervosa, que parece pegar as cenas por acaso, dá a sensação de um documentário sobre gente que não deveria estar sendo filmada.", "Estreou em 2018 na HBO e foi crescendo a cada temporada. Terminou em 2023, na quarta, em plena força, coisa rara numa época em que tanta série se estica demais. Levou o Emmy de melhor série dramática em três das quatro temporadas e ganhou lugar ao lado de Veep e The Thick of It entre as grandes sátiras do poder, mas com um olhar mais dolorido.", "Serve a quem gosta de diálogos afiados, intriga de bastidor e personagens complicados. Não é para quem precisa de alguém por quem torcer: aqui quase todos são cruéis, e a diversão está justamente nisso. Há acontecimentos importantes pelo caminho, e é melhor chegar a eles sem aviso. Comece pelo primeiro episódio e dê tempo à 1ª temporada, que apresenta o clã e só depois mostra a que veio."]}}, {"rank": 5, "nyt": "Fleabag", "anos": "2016–2019", "pt": "Fleabag", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Fleabag", "ficha": {"tagline": "Uma londrina que fala com a câmera para não ter que falar com ninguém.", "genero": "Comédia dramática", "pais": "Reino Unido", "anos": "2016–2019 · 2 temporadas", "elenco": "Phoebe Waller-Bridge, Sian Clifford, Olivia Colman, Bill Paterson, Brett Gelman, Andrew Scott, Hugh Skinner", "emissora": "BBC Three (1ª temporada) e BBC One (2ª), em coprodução com a Amazon", "premios": "Emmys de melhor série de comédia, melhor atriz de comédia e melhor roteiro de comédia em 2019.", "parecido": "Girls, Catastrophe, I May Destroy You", "episodio": "Episódio 1 da 2ª temporada.", "texto": ["Fleabag — o apelido da protagonista, que nunca ouvimos chamarem de outro jeito — é uma londrina de trinta e poucos anos que toca um café de porquinhos-da-índia que vai mal, vive de relações passageiras e garante que está tudo ótimo. Quando a vida aperta, ela olha para a câmera e comenta o que acontece, como se o espectador fosse o único a ouvir a verdade. A família é um problema à parte: a irmã controladora, o pai distante, a nova companheira dele.", "Phoebe Waller-Bridge criou a série a partir de uma peça solo que ela mesma escreveu e encenou, e fez da conversa com a câmera o coração da história: o que Fleabag esconde de quem está em volta, e depois de quem a assiste, importa mais do que qualquer trama. Os episódios são curtos, quase sem gordura, e o humor é cheio de sexo, constrangimento e frases cortantes. Aos poucos, por trás das piadas, aparece uma tristeza que a protagonista evita encarar. Há uma revelação nesse caminho que muda o jeito de ver o que veio antes; vale chegar a ela sem saber.", "São só duas temporadas, de seis episódios cada, exibidas em 2016 e 2019. A segunda, com a chegada de um padre vivido por Andrew Scott, é citada com frequência entre as melhores da comédia recente e rendeu à série uma safra de Emmys. Abriu caminho para outras histórias de mulheres imperfeitas no centro e lançou a carreira de roteirista de Waller-Bridge, que depois criou a primeira temporada de Killing Eve. Em menos de seis horas no total, é daquelas séries que se vê de uma vez e se revê com outros olhos.", "Serve a quem gosta de humor ácido e de comédia que também faz chorar. Como tudo cabe em poucas horas, é uma ótima porta de entrada para a TV britânica. Não é para quem se incomoda com sexo e linguagem franca, nem com assuntos pesados como luto. Comece pelo primeiro episódio e vá sem pressa: as duas temporadas se completam, e a segunda perde o efeito sem a primeira."]}}, {"rank": 6, "nyt": "Game of Thrones", "anos": "2011–2019", "pt": "Game of Thrones", "alt": "A Guerra dos Tronos (Portugal)", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Game+of+Thrones", "ficha": {"tagline": "Reinos em guerra por um trono de espadas, com o inverno — e os dragões — a caminho.", "genero": "Fantasia épica", "pais": "Estados Unidos", "anos": "2011–2019 · 8 temporadas", "elenco": "Peter Dinklage, Lena Headey, Emilia Clarke, Kit Harington, Sophie Turner, Maisie Williams, Nikolaj Coster-Waldau, Sean Bean, Charles Dance, Iain Glen", "emissora": "HBO", "premios": "59 Emmys, o maior número já conquistado por uma série dramática; melhor série dramática em 2015, 2016, 2018 e 2019.", "parecido": "A Casa do Dragão, The Last Kingdom, Vikings", "episodio": "“Hardhome” (5ª temporada, ep. 8).", "texto": ["Em Westeros, um continente inventado que lembra a Europa medieval, várias casas nobres passam a disputar o Trono de Ferro. Ao norte, atrás de uma muralha gigantesca de gelo, uma ameaça antiga volta a se mexer. Do outro lado do mar, uma jovem exilada, Daenerys Targaryen, junta exércitos e dragões para reclamar o reino que foi da família. Baseada nos livros As Crônicas de Gelo e Fogo, de George R. R. Martin, a série se inspira em guerras reais, como a Guerra das Duas Rosas, na Inglaterra.", "O que a transformou em fenômeno foi juntar a escala de um grande filme com a coragem de eliminar personagens importantes sem aviso, o que dava a cada episódio ar de acontecimento. Há várias histórias correndo em paralelo, muitos nomes, política, traições, casamentos que mudam o mapa. Línguas inventadas para a série, como o dothraki, efeitos caros e um elenco enorme, com Peter Dinklage, Lena Headey, Emilia Clarke e Kit Harington, sustentaram as primeiras temporadas, as mais admiradas. Há reviravoltas chocantes pelo caminho, daquelas que muita gente lembra onde estava ao ver; evite resumos.", "Foi ao ar na HBO entre 2011 e 2019 e por anos foi a série mais comentada do mundo. Tem o recorde de Emmys entre as séries dramáticas e mudou o que as emissoras achavam possível fazer, em dinheiro e em ambição. As últimas temporadas, que passaram os livros publicados, dividiram o público, mas deram origem a A Casa do Dragão (2022) e a uma onda de fantasia na TV.", "Serve a quem gosta de intriga política, histórias grandes e universos que pedem tempo. Não é preciso gostar de fantasia: o que importa são as pessoas. Não é para quem se incomoda com violência explícita, sexo e crueldade, que aparecem sem cerimônia. Comece pelo primeiro episódio, que apresenta muita gente e pede paciência; a história engata logo depois e a série cresce até o auge, que muitos fãs veem no meio do caminho."]}}, {"rank": 7, "nyt": "Veep", "anos": "2012–2019", "pt": "Veep", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Veep", "ficha": {"tagline": "A vice-presidente dos Estados Unidos tem muito título e pouquíssimo poder.", "genero": "Comédia política (sátira)", "pais": "Estados Unidos", "anos": "2012–2019 · 7 temporadas", "elenco": "Julia Louis-Dreyfus, Tony Hale, Anna Chlumsky, Reid Scott, Matt Walsh, Timothy Simons, Kevin Dunn, Sam Richardson", "emissora": "HBO", "premios": "Emmy de melhor série de comédia em 2015, 2016 e 2017; seis Emmys seguidos de melhor atriz de comédia para Julia Louis-Dreyfus.", "parecido": "The Thick of It, Succession, Um Maluco na TV", "episodio": "", "texto": ["Selina Meyer já foi senadora, disputou a presidência e acabou vice-presidente dos Estados Unidos, um cargo com mais cerimônia do que poder real. A série segue a vice e sua equipe de assessores, que passam os dias tentando fazer a chefe parecer competente, simpática e decente, e fracassando de maneiras sempre inventivas. Uma curiosidade: em nenhum momento a série diz a que partido ela pertence, para que a sátira valha para qualquer lado.", "Criada pelo britânico Armando Iannucci, a série tem uma assinatura: o xingamento como forma de arte. Os roteiros têm uma musicalidade de palavrão e de insulto elaborado, ditos em alta velocidade, em escritórios onde ninguém sabe exatamente o que está fazendo. Julia Louis-Dreyfus, estrela desde Seinfeld, dá a Selina uma mistura irresistível de vaidade, desespero e ambição, e o elenco ao redor, de Tony Hale a Anna Chlumsky e Timothy Simons, funciona como um relógio. A câmera na mão dá a impressão de um documentário sem entrevistas, que segue a equipe pelos corredores. Não há heróis nem lição de moral.", "Foi ao ar na HBO entre 2012 e 2019, com Iannucci à frente das quatro primeiras temporadas e David Mandel nas demais. Rendeu a Julia Louis-Dreyfus seis Emmys seguidos de melhor atriz de comédia e é, ao lado de The Thick of It, referência em sátira política na TV. Conforme a política real foi ficando mais absurda, a ficção passou a ter dificuldade de competir, comentário que se ouviu muito na época.", "Serve a quem gosta de humor ácido e rápido, diálogos cheios de ironia e política vista pelos bastidores. Não é preciso saber nada de política americana, embora ajude. Não é para quem se incomoda com palavrão em quantidade, nem para quem procura personagens para admirar: aqui ninguém se salva. Comece pelo primeiro episódio; a 1ª temporada é curta e já mostra o tom, e a série fica ainda mais afiada com o passar dos anos."]}}, {"rank": 8, "nyt": "30 Rock", "anos": "2006–2013", "pt": "Um Maluco na TV", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=30+Rock", "ficha": {"tagline": "Os bastidores de um programa de humor, tocados por gente que nunca deveria estar no comando.", "genero": "Comédia", "pais": "Estados Unidos", "anos": "2006–2013 · 7 temporadas", "elenco": "Tina Fey, Alec Baldwin, Tracy Morgan, Jane Krakowski, Jack McBrayer, Scott Adsit, Judah Friedlander", "emissora": "NBC", "premios": "16 Emmys, incluindo melhor série de comédia três anos seguidos (2007 a 2009).", "parecido": "Confusões de Leslie, Arrested Development, Community", "episodio": "", "texto": ["O título é o endereço da sede da NBC em Nova York, 30 Rockefeller Plaza. Liz Lemon, interpretada por Tina Fey, é a roteirista-chefe de um programa de esquetes de televisão e tenta manter a ordem enquanto todos ao redor são mais malucos do que ela: a estrela vaidosa e carente, o comediante imprevisível, o contínuo devoto da emissora e o executivo da empresa dona do canal, que quer mandar em tudo.", "Fey, que foi roteirista-chefe do Saturday Night Live, escreveu a série a partir do que viu nos bastidores. O ritmo é frenético: quase toda fala é piada, há gags visuais no fundo das cenas e referências que a série dispara e abandona antes de o espectador alcançá-las. O melhor da série é a combinação de um elenco muito entrosado — Alec Baldwin como o executivo Jack Donaghy, Tracy Morgan, Jane Krakowski e Jack McBrayer — com uma heroína sem glamour, que come mal, trabalha demais e erra nos encontros. É uma sátira da televisão feita por quem a conhece, incluindo o canal que a exibia.", "Foi ao ar na NBC de 2006 a 2013 e levou o Emmy de melhor série de comédia três anos seguidos. Teve audiência modesta, mas foi adorada pela crítica e ganhou um culto crescente depois. Liz Lemon virou referência para uma geração de comédias com mulheres imperfeitas no centro, e Fey voltaria ao humor acelerado em Unbreakable Kimmy Schmidt. Quem gosta dela costuma lembrar também dos coadjuvantes impagáveis e das participações especiais, que só aumentaram com os anos.", "Serve a quem gosta de humor rápido, absurdo e cheio de referências, e a quem se diverte com os bastidores da TV. Não é para quem prefere comédia com emoção constante: a série é mais ironia do que sentimento. Comece pelo primeiro episódio; a 1ª temporada ainda busca o tom, e a série pega o ritmo de metralhadora nas seguintes. Vale ver com atenção, porque as melhores piadas passam rápido."]}}, {"rank": 9, "nyt": "Curb Your Enthusiasm", "anos": "2000–2024", "pt": "Curb Your Enthusiasm", "alt": "Segura a Onda (título de exibição no Brasil", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Curb+Your+Enthusiasm", "ficha": {"tagline": "Larry David vive em Los Angeles e briga com as regras sociais que todo mundo finge respeitar.", "genero": "Comédia", "pais": "Estados Unidos", "anos": "2000–2024 · 12 temporadas", "elenco": "Larry David, Jeff Garlin, Cheryl Hines, Susie Essman, J. B. Smoove, Richard Lewis", "emissora": "HBO", "premios": "Globo de Ouro de melhor série de comédia e dois Emmys, além de dezenas de indicações.", "parecido": "Seinfeld, Louie, The Office (Reino Unido)", "episodio": "", "texto": ["Larry David, cocriador de Seinfeld, interpreta uma versão exagerada de si mesmo: um milionário rabugento de Los Angeles que não consegue deixar passar nenhum deslize de etiqueta. Cada episódio parte de um pequeno incômodo — um convite para jantar, uma ligação mal atendida, uma fila — e vai se complicando numa cadeia de mal-entendidos que costuma se fechar de forma engenhosa nos minutos finais, quando linhas soltas se encontram.", "A regra de ouro da série é que Larry está sempre certo na regra e errado na hora. Ele diz em voz alta o que todo mundo pensa e ninguém ousa falar, e o prazer é ver as consequências. Os diálogos são em grande parte improvisados a partir de um esqueleto de cada cena, o que dá aos atores o ritmo de uma conversa de verdade, e não há trilha de risadas. A turma em volta é parte do encanto: Jeff Garlin como o empresário, Cheryl Hines como a esposa, Susie Essman como a boca-suja Susie e, a partir da 6ª temporada, J. B. Smoove como Leon.", "Nasceu de um especial de 1999 e estreou como série em 2000, na HBO, sendo exibida com longas pausas até 2024, num total de 12 temporadas. A série ficou parada por anos e sempre voltou, o que ajudou a transformá-la numa velha conhecida do público. Firmou um modelo de comédia em que o protagonista não precisa ser simpático, e sua influência é visível em muita comédia de humor desconfortável. A abertura, com a música “Frolic”, é das mais reconhecíveis da TV.", "Serve a quem gosta de comédia de situação, de humor desconfortável e de ver o mundo pelo olhar de um rabugento. Não é para quem se incomoda com personagens antipáticos e constrangimento sem trégua. Cada episódio funciona quase sozinho, mas as temporadas têm arcos, e a 7ª, em que Larry tenta reunir o elenco de Seinfeld, é a que muita gente cita como ponto alto. Comece pelo começo: as primeiras temporadas já mostram a fórmula."]}}, {"rank": 10, "nyt": "Atlanta", "anos": "2016–2022", "pt": "Atlanta", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Atlanta", "ficha": {"tagline": "Dois primos tentam abrir caminho na cena musical de Atlanta — e a série vira o que quiser a cada episódio.", "genero": "Comédia dramática", "pais": "Estados Unidos", "anos": "2016–2022 · 4 temporadas", "elenco": "Donald Glover, Brian Tyree Henry, Lakeith Stanfield, Zazie Beetz", "emissora": "FX", "premios": "Donald Glover ganhou os Emmys de melhor ator e de melhor direção de comédia (2017) e a série levou o Globo de Ouro de melhor série de comédia no mesmo ano.", "parecido": "Louie, Barry, Insecure", "episodio": "“Teddy Perkins” (2ª temporada, ep. 6).", "texto": ["Earn largou a faculdade, vive de bicos e dorme ora na casa da ex-namorada, ora na da família, em Atlanta, na Geórgia. Quando o primo Alfred, que rima como Paper Boi, começa a ficar conhecido na cidade, Earn se oferece para empresariá-lo e tenta se encaixar na cena do rap local. A premissa é simples, mas a série a usa como ponto de partida para falar de dinheiro, raça, fama e da vida de quem está perto do sucesso sem nunca chegar nele.", "Donald Glover criou, escreveu e estrelou a série, e o que a torna única é a imprevisibilidade: cada episódio muda de estilo. Há capítulos realistas, outros de humor absurdo, um quase de terror (“Teddy Perkins”) e uma sátira de programa de TV de uma emissora inexistente. A direção de Hiro Murai, em boa parte dos episódios, deu à série um visual entre o realista e o onírico, e o elenco, com Brian Tyree Henry, Lakeith Stanfield e Zazie Beetz, é tão bom que cada personagem ganha episódios só seus.", "Estreou em 2016 no FX e foi até 2022, em quatro temporadas; a terceira leva os personagens a uma turnê pela Europa, e a quarta volta a Atlanta. Glover, que também é músico sob o nome Childish Gambino, ganhou os Emmys de melhor ator e de direção de comédia em 2017. A série abriu espaço na TV americana para histórias negras contadas por quem as vive, sem se explicar para quem está de fora. A própria cidade de Atlanta é personagem: seus bairros, seu trânsito, seu jeito de conversar e a música que sai de cada carro.", "Serve a quem gosta de comédias estranhas, de música e de séries que não se prendem a uma fórmula. Não é para quem quer trama linear ou piadas fáceis: muitos episódios deixam perguntas sem resposta de propósito, e a série é mais atmosfera do que enredo. Alguns episódios fogem do resto como se fossem outra série; isso é proposital. Comece pelo primeiro episódio e siga a ordem, que mostra bem o que vem depois."]}}, {"rank": 11, "nyt": "The Office (U.S.)", "anos": "2005–2013", "pt": "The Office (EUA)", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=The+Office+%28U.S.%29", "ficha": {"tagline": "Um escritório de papel em Scranton, onde o chefe quer ser amado e os funcionários só querem ir para casa.", "genero": "Comédia (falso documentário)", "pais": "Estados Unidos", "anos": "2005–2013 · 9 temporadas", "elenco": "Steve Carell, Rainn Wilson, John Krasinski, Jenna Fischer, B. J. Novak, Mindy Kaling, Ed Helms, Angela Kinsey", "emissora": "NBC", "premios": "Emmy de melhor série de comédia (2006) e Globo de Ouro de melhor ator de comédia para Steve Carell (2006).", "parecido": "The Office (Reino Unido), Confusões de Leslie, Família Moderna", "episodio": "“Dinner Party” (4ª temporada, ep. 13).", "texto": ["Scranton, na Pensilvânia: a filial de uma distribuidora de papel, a Dunder Mifflin, é dirigida por Michael Scott (Steve Carell), um chefe que quer ser amado por todos, se acha engraçadíssimo e vive passando vergonha. Em volta dele, uma equipe que só quer ir para casa: o vendedor brincalhão Jim, a recepcionista Pam, o bajulador Dwight. Tudo é filmado como se uma equipe de documentário acompanhasse o expediente, e os personagens falam direto com a câmera.", "A versão americana adapta a série britânica de Ricky Gervais (também nesta lista), mas demorou a achar a própria voz. Nas primeiras temporadas, Michael era uma cópia mais cruel do original; a partir da segunda, ganhou um coração, e a comédia de constrangimento passou a conviver com carinho. É isso que a diferencia: sob o vexame, há afeto de verdade pela turma. Os personagens ganham profundidade com o tempo, e o romance de Jim e Pam, contado em olhares para a câmera, é dos mais queridos da TV. Os coadjuvantes, como Kevin, Stanley e Phyllis, ganham seus momentos, e a graça muitas vezes está nos pequenos rituais do escritório: a festa de aniversário, a reunião inútil, a brincadeira que passa do ponto. Funciona tanto em maratona quanto em episódios soltos.", "Serve a quem gosta de comédia de situação e de séries para rever muitas vezes. Não é para quem não suporta passar vergonha alheia: algumas cenas dão vontade de desviar o olhar. A 1ª temporada, curta, é a que mais lembra o original; se ela não pegar, tente a 2ª, em que o tom muda."]}}, {"rank": 12, "nyt": "Arrested Development", "anos": "2003–2019", "pt": "Arrested Development", "alt": "Caindo na Real (BR) · De Mal a Pior (Portugal)", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Arrested+Development", "ficha": {"tagline": "Uma família rica e desastrada perde tudo — menos o hábito de se atrapalhar.", "genero": "Comédia", "pais": "Estados Unidos", "anos": "2003–2019 · 5 temporadas", "elenco": "Jason Bateman, Portia de Rossi, Will Arnett, Michael Cera, Alia Shawkat, Tony Hale, David Cross, Jeffrey Tambor, Jessica Walter", "emissora": "Fox (3 primeiras temporadas) e Netflix (as duas últimas)", "premios": "Seis Emmys, incluindo melhor série de comédia (2004); Globo de Ouro de melhor ator de comédia para Jason Bateman (2005).", "parecido": "Um Maluco na TV, Community, It’s Always Sunny in Philadelphia", "episodio": "", "texto": ["Michael Bluth (Jason Bateman) é o único adulto da família Bluth: quando o pai, dono de uma construtora, é preso por fraude, ele assume o que sobrou — uma empresa em crise, uma mansão prestes a ser perdida, uma mãe manipuladora, uma irmã mimada, um irmão que se acha mágico e um filho adolescente. A série remios": "Emmys de melhor ator (Kyle Chandler) e de roteiro, em 2011; prêmio Peabody em 2007.", "parecido": "Parenthood, This Is Us", "episodio": "", "texto": ["Dillon, no interior do Texas, vive de sexta-feira à noite: o time de futebol americano do colégio é motivo de orgulho, de aposta e de pressão sobre garotos de dezessete anos. Quando o técnico Eric Taylor (Kyle Chandler) assume a equipe, passa a carregar as expectativas de toda a cidade, ao lado da esposa, Tami (Connie Britton), orientadora do colégio. A série é inspirada no livro-reportagem de Buzz Bissinger e no filme que ele gerou.", "O esporte é só o ponto de partida. A câmera na mão, os diálogos meio improvisados e os atores pouco conhecidos criam uma sensação de realidade rara na TV, e os temas reais — dinheiro, classe, racismo, o peso de crescer em cidade pequena — dão a ela uma emoção honesta, sem apelação. O casal Taylor é um dos retratos de casamento mais admirados da televisão, e o lema do time, “Clear eyes, full hearts, can’t lose”, virou frase famosa. A direção prefere o improviso: os atores têm liberdade para atrapalhar as falas, e as cenas de futebol são filmadas de dentro do jogo, como se a câmera fosse mais um jogador. A série gosta de gente comum, como os pais, os professores e os jovens que sonham em sair da cidade.", "Nunca foi sucesso de audiência, mas conquistou fãs fiéis e uma das melhores reputações da década. Serve a quem gosta de dramas de personagens e de cidades pequenas; não é preciso entender de futebol americano. Não é para quem quer ação ou tramas mirabolantes. Comece pelo primeiro episódio: muitos fãs consideram a 1ª temporada a mais forte."]}}, {"rank": 15, "nyt": "Six Feet Under", "anos": "2001–2005", "pt": "A Sete Palmos", "alt": "Sete Palmos de Terra (Portugal)", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Six+Feet+Under", "ficha": {"tagline": "Uma funerária de família e o que a morte ensina sobre como viver.", "genero": "Drama", "pais": "Estados Unidos", "anos": "2001–2005 · 5 temporadas", "elenco": "Peter Krause, Michael C. Hall, Frances Conroy, Lauren Ambrose, Rachel Griffiths, Freddy Rodriguez", "emissora": "HBO", "premios": "Nove Emmys e vários Globos de Ouro.", "parecido": "Família Soprano, Breaking Bad, Dexter", "episodio": "", "texto": ["Criada por Alan Ball, roteirista de Beleza Americana, a série acompanha a família Fisher, que toca uma funerária em Los Angeles. Nate (Peter Krause) volta para casa para o enterro do pai e acaba ficando; David (Michael C. Hall), o irmão reservado, esconde a própria vida íntima; a mãe, Ruth, tenta aprender a viver de novo; a caçula, Claire, só quer fugir. Todo episódio começa com a morte de alguém e usa o velório para fazer os vivos olharem para as próprias escolhas.", "A premissa pode soar macabra, mas o tom é muito humano, com humor seco e várias cenas de cortar o coração. É uma série sobre perda, família e as coisas que ninguém diz à mesa, que encara de frente um assunto que a TV costuma evitar. Foi das séries que firmaram a HBO como casa de histórias adultas e complexas, ao lado de Família Soprano, e Michael C. Hall, que depois viveria Dexter, está ótimo. O último episódio é um dos mais comentados da televisão. Os personagens secundários ganham histórias que se desenvolvem ao longo das cinco temporadas, sem pressa de resolver tudo. A série também brinca com a imaginação: os mortos às vezes aparecem para conversar com os vivos, num toque de humor e melancolia que se tornou sua marca.", "Serve a quem aprecia dramas sensíveis e quer pensar na morte sem pânico. Não é para quem está de luto recente e prefere evitar o assunto, nem para quem quer ritmo acelerado. Comece pelo primeiro episódio e evite spoilers sobre o final: ele vale ser visto sem saber."]}}, {"rank": 16, "nyt": "The Office (U.K.)", "anos": "2001–2003", "pt": "The Office (Reino Unido)", "alt": "The Office - A Empresa (Portugal)", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=The+Office+%28U.K.%29", "ficha": {"tagline": "O pior chefe do mundo, observado por uma câmera de documentário que não perdoa nada.", "genero": "Comédia (falso documentário)", "pais": "Reino Unido", "anos": "2001–2003 · 2 temporadas e um especial de Natal", "elenco": "Ricky Gervais, Martin Freeman, Mackenzie Crook, Lucy Davis, Ewen MacIntosh", "emissora": "BBC Two", "premios": "Vários BAFTAs e dois Globos de Ouro (2004), de melhor série de comédia e melhor ator de comédia para Ricky Gervais.", "parecido": "The Office (EUA), Extras, The Thick of It", "episodio": "O especial de Natal (2003).", "texto": ["Em Slough, cidade-dormitório inglesa, a empresa de papel Wernham Hogg é dirigida por David Brent (Ricky Gervais), que se acha chefe-amigo, comediante nato e filósofo, e nunca percebe como os outros o veem. Uma equipe de documentário acompanha o dia a dia do escritório. Em apenas doze episódios e um especial de Natal, a série de Gervais e Stephen Merchant criou uma linguagem de comédia: câmeras que se demoram nos olhares, silêncios que qualquer sitcom cortaria, constrangimento levado ao limite.", "Por baixo da comédia há uma história de amor discreta e comovente, entre o vendedor Tim (Martin Freeman) e a recepcionista Dawn (Lucy Davis), e uma crônica sobre empregos que ninguém escolheu. Brent é insuportável e, de repente, dá pena: essa mistura é a assinatura da série. O formato foi refeito em dezenas de países, inclusive nos Estados Unidos, mas o original, mais seco e mais curto, segue como referência. Não há risadas gravadas: a graça nasce do silêncio, do olhar e do instante em que alguém percebe que falou demais. Por ser curta, a série não teve tempo de repetir fórmulas, e é essa concisão que a mantém afiada. Mesmo quem conhece a versão americana se surpreende com o tom mais seco e mais triste do original.", "Estreou em 2001, na BBC Two. Serve a quem gosta de humor britânico seco e de comédia de constrangimento. Não é para quem não aguenta cenas em que dá vontade de sair da sala. Como é pouco mais de uma dúzi uações — é de primeiríssima linha, e cada temporada ganha tom próprio, às vezes mais político, às vezes mais íntimo. Claire Foy, Olivia Colman e Imelda Staunton se revezam como a rainha, e a troca de elenco é parte do charme: vemos as mesmas pessoas envelhecerem. As temporadas funcionam como pequenos filmes, cada uma com um conflito próprio: uma crise de governo, um escândalo, uma viagem. Os atores de apoio, como Vanessa Kirby, Helena Bonham Carter e Gillian Anderson, também têm momentos marcantes.", "Foi ao ar na Netflix de 2016 a 2023 e levou o Emmy e o Globo de Ouro de melhor série dramática. Serve a quem gosta de drama de época, de intrigas de família e de história sem pressa. Não é para quem procura rigor histórico: veja como entretenimento, não como livro de história. Comece pelo primeiro episódio."]}}, {"rank": 21, "nyt": "The White Lotus", "anos": "2021–hoje", "pt": "The White Lotus", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=The+White+Lotus", "ficha": {"tagline": "Férias de luxo, hóspedes ricos e uma tensão que nunca descansa.", "genero": "Comédia dramática de suspense (sátira social)", "pais": "Estados Unidos", "anos": "2021 em diante · 3 temporadas até 2025", "elenco": "Jennifer Coolidge, Murray Bartlett, Connie Britton, Sydney Sweeney, Natasha Rothwell, Aubrey Plaza, Theo James, Michelle Monaghan, Walton Goggins, Carrie Coon (o elenco muda a cada temporada)", "emissora": "HBO", "premios": "Vários Emmys em 2022, incluindo melhor minissérie e melhor atriz coadjuvante (Jennifer Coolidge).", "parecido": "Succession, Big Little Lies, Mare of Easttown", "episodio": "", "texto": ["Cada temporada se passa num resort de luxo da rede fictícia White Lotus, num lugar diferente — Havaí, Sicília, Tailândia —, com um novo grupo de hóspedes e funcionários e uma morte anunciada logo de início, sem que se saiba quem é a vítima. Criada por Mike White, é uma sátira de ricos que não escutam ninguém e de empregados que precisam sorrir o tempo todo.", "O suspense é o pretexto; o assunto de verdade é dinheiro, desigualdade e as formas pelas quais gente privilegiada consegue estragar o dia dos outros sem notar. Os diálogos provocam riso pelo desconforto, e a graça está em descobrir, aos poucos, quem morreu e por quê. A personagem de Jennifer Coolidge, a trágica e hilária Tanya, virou a figura mais querida da série, e os cenários dão à viagem um jeito de pesadelo de cartão-postal. A trilha de Cristobal Tapia de Veer, com tambores e vozes, dá à série um clima de ameaça mesmo quando tudo parece ensolarado. O elenco muda a cada temporada, com poucos personagens que retornam, e isso faz de cada viagem uma história nova.", "Estreou em 2021 na HBO e levou vários Emmys em 2022, incluindo o de melhor minissérie. Serve a quem gosta de sátira social, mistério e comédia desconfortável. Não é para quem procura personagens por quem torcer. Cada temporada pode ser vista separadamente, então dá para começar pela primeira, a mais enxuta, e ver se pega."]}}, {"rank": 22, "nyt": "Lost", "anos": "2004–2010", "pt": "Lost", "alt": "Perdidos (Portugal)", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Lost", "ficha": {"tagline": "Sobreviventes de um acidente aéreo numa ilha onde nada é o que parece.", "genero": "Drama de mistério e ficção científica", "pais": "Estados Unidos", "anos": "2004–2010 · 6 temporadas", "elenco": "Matthew Fox, Evangeline Lilly, Josh Holloway, Terry O’Quinn, Jorge Garcia, Naveen Andrews, Daniel Dae Kim, Yunjin Kim, Michael Emerson, Elizabeth Mitchell", "emissora": "ABC", "premios": "Emmy de melhor série dramática em 2005, entre outros prêmios.", "parecido": "The Leftovers, Fringe, Dark", "episodio": "", "texto": ["Um voo de Sydney para Los Angeles cai numa ilha do Pacífico. Alguns passageiros morrem, outros resistem, e logo descobrem que o lugar guarda segredos: uma criatura de fumaça, sinais de rádio de décadas atrás, uma escotilha misteriosa, uma sequência de números que reaparece e grupos de habitantes hostis.", "Cada episódio mistura o presente na ilha com cenas do passado dos personagens (e, mais tarde, do futuro), e as histórias se cruzam de maneiras que só fazem sentido depois. Criada por J. J. Abrams, Damon Lindelof e Jeffrey Lieber, foi um fenômeno mundial e criou o hábito de discutir teorias a cada semana, numa época em que as redes sociais ainda engatinhavam. O elenco coral, com Matthew Fox, Evangeline Lilly, Josh Holloway, Terry O’Quinn e Jorge Garcia, e as reviravoltas deram a ela um poder de viciar raro. A série foi precursora das discussões em tempo real e das teorias de fãs, e boa parte da televisão de mistério que veio depois deve algo a ela. A ilha, filmada no Havaí, é quase um personagem, e o piloto é um dos mais caros e mais comentados da época.", "Foi ao ar na ABC de 2004 a 2010 e levou o Emmy de melhor série dramática em 2005. O desfecho dividiu os fãs; vá sem esperar respostas para tudo. Serve a quem gosta de mistério e de teorias. Não é para quem odeia perguntas sem resposta. Comece pelo piloto, que é cinematográfico, e evite spoilers: a série foi pensada para ser descoberta."]}}, {"rank": 23, "nyt": "The Comeback", "anos": "2005–2026", "pt": "The Comeback", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=The+Comeback", "ficha": {"tagline": "Uma atriz de sitcom esquecida deixa as câmeras mostrarem tudo — inclusive o que ela queria esconder.", "genero": "Comédia (falso documentário)", "pais": "Estados Unidos", "anos": "2005–2026 · 3 temporadas (2005, 2014 e 2026)", "elenco": "Lisa Kudrow, Dan Bucatinsky, Damian Young, Laura Silverman, Robert Michael Morris", "emissora": "HBO", "premios": "Poucos prêmios; a 2ª temporada rendeu a Lisa Kudrow uma indicação ao Emmy (2015). Hoje é considerada uma das comédias mais influentes de sua época.", "parecido": "Curb Your Enthusiasm, Hacks, Um Maluco na TV", "episodio": "", "texto": ["Valerie Cherish foi estrela de uma sitcom nos anos 1990 e agora aceita, quase de joelhos, um papel de coadjuvante numa comédia nova. Uma equipe de reality show registra seu retorno à TV e, quando a câmera está ligada, ela insiste em sorrir, mesmo nos momentos mais humilhantes. Lisa Kudrow, a Phoebe de Friends, criou a série com Michael Patrick King, de Sex and the City, e deu à personagem uma vaidade comovente e um talento desastroso para o constrangimento.", "Estreou em 2005, foi cancelada depois de uma temporada e só foi valorizada anos depois, quando a cultura do reality show e da fama instantânea passou a funcionar exatamente como ela previa. Voltou em 2014, para uma segunda temporada. É uma comédia de constrangimento com um coração triste, sobre fama, envelhecimento e a vontade de ser vista. Para quem conhece o formato do reality, há um jogo de espelhos: Valerie escolhe o que mostrar à câmera, mas a edição mostra o que ela queria esconder. A atuação de Kudrow é considerada por muitos o ponto alto de sua carreira.", "Serve a quem gosta de humor de constrangimento e de metalinguagem sobre a TV. Não é para quem não suporta passar vergonha alheia: a série leva isso muito a sério. Se Curb Your Enthusiasm e The Office fazem você rir e se encolher, esta vai no mesmo lugar. Comece pelo primeiro episódio e dê tempo, porque a série fica mais rica quando se conhece a personagem."]}}, {"rank": 24, "nyt": "Deadwood", "anos": "2004–2006", "pt": "Deadwood", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Deadwood", "ficha": {"tagline": "O Velho Oeste como ele realmente era: sujo, violento e muito falador.", "genero": "Faroeste", "pais": "Estados Unidos", "anos": "2004–2006 · 3 temporadas (mais um filme em 2019)", "elenco": "Timothy Olyphant, Ian McShane, Molly Parker, Brad Dourif, Robin Weigert, Paula Malcomson, Jim Beaver", "emissora": "HBO", "premios": "Globo de Ouro de melhor ator (Ian McShane, 2005) e Emmys, entre eles o de direção (Walter Hill, 2005).", "parecido": "A Escuta, Justified, Peaky Blinders", "episodio": "", "texto": ["Deadwood, no território de Dakota, em 1876, é um acampamento de mineradores que existe fora da lei americana e cresce a cada semana, em terras que um tratado reservava aos sioux. O criador, David Milch, mistura figuras reais — o pistoleiro Wild Bill Hickok, Calamity Jane — com personagens inventados. O eixo da história é a relação entre o xerife Seth Bullock (Timothy Olyphant), que chegou para ganhar dinheiro e acabou virando homem da lei, e Al Swearengen (Ian McShane), dono do saloon The Gem, que quer manter o controle da cidade.", "O que mais chama atenção é a linguagem: diálogos longos, floridos e carregados de palavrões, num ritmo quase shakespeariano, num cenário de lama e sujeira. É um faroeste sem mocinho: a cidade vai nascendo na marra, entre alianças e traições, e a série mostra como uma comunidade, um negócio e uma lei podem surgir do nada. Ian McShane, como Swearengen, é a atuação mais comentada. Os personagens secundários, como o rival Cy Tolliver, o médico Doc Cochran e a viúva Alma Garret, têm histórias tão boas quanto as dos protagonistas, e a cidade, com sua lama e seus cenários, é uma das mais marcantes da TV.", "Foi cancelada pela HBO em 2006, com a trama em aberto, e só em 2019 ganhou um filme de fechamento. Serve a quem gosta de faroeste, de linguagem rica e de histórias sobre como as sociedades nascem. Não é para quem não aguenta palavrão em quantidade e violência crua. Comece pelo primeiro episódio e dê tempo para se acostumar com a fala: depois de dois ou três episódios, ela vira música."]}}, {"rank": 25, "nyt": "The Leftovers", "anos": "2014–2017", "pt": "The Leftovers", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=The+Leftovers", "ficha": {"tagline": "Dois por cento da humanidade desaparece sem explicação; quem ficou tenta entender como seguir.", "genero": "Drama de mistério", "pais": "Estados Unidos", "anos": "2014–2017 · 3 temporadas", "elenco": "Justin Theroux, Carrie Coon, Amy Brenneman, Christopher Eccleston, Liv Tyler, Ann Dowd, Margaret Qualley, Scott Glenn, Regina King", "emissora": "HBO", "premios": "Sem grandes prêmios, mas aparece com frequência em listas das melhores séries da década.", "parecido": "Lost, Dark, Station Eleven", "episodio": "", "texto": ["Num instante, duas em cada cem pessoas do planeta somem sem deixar rastro. Três anos depois, na pequena cidade de Mapleton, o chefe de polícia Kevin Garvey (Justin Theroux) tenta manter a ordem enquanto surgem seitas — uma delas, os “Remanescentes Culpados”, vestida de branco, silenciosa e decidida a não deixar ninguém esquecer a perda. A série foi criada por Damon Lindelof, de Lost, e Tom Perrotta, autor do romance que a inspirou.", "Ao contrário de Lost, a série não se interessa por explicar o desaparecimento. O seu assunto é o luto: o que se faz com uma perda sem resposta, como as pessoas se agarram a rituais e crenças para suportar a dor. A primeira temporada é sombria; a segunda e a terceira mudam de cenário e de tom, ficam mais estranhas e mais comoventes, e costumam ser as favoritas dos fãs. Carrie Coon, como Nora, tem um dos papéis mais lembrados. A trilha de Max Richter, a abertura que muda a cada temporada e as atuações de Coon, Theroux, Christopher Eccleston e Ann Dowd ajudam a sustentar o tom. A série exige paciência, mas recompensa quem a acompanha até o fim.", "Passou na HBO de 2014 a 2017 com audiência modesta, mas aparece em listas das melhores séries da década. Serve a quem gosta de dramas sobre perda e de mistério sem resolução. Não é para quem quer respostas: a série as nega de propósito. Comece pelo primeiro episódio; se a 1ª temporada parecer pesada, insista — a história muda de cara."]}}, {"rank": 26, "nyt": "Black Mirror", "anos": "2011–hoje", "pt": "Black Mirror", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Black+Mirror", "ficha": {"tagline": "Contos de ficção científica em que a tecnologia de hoje dá um passo a mais — e o passo dá errado.", "genero": "Antologia de ficção científica", "pais": "Reino Unido / Estados Unidos", "anos": "2011–hoje · várias temporadas", "elenco": "Elenco novo a cada episódio: Daniel Kaluuya, Jon Hamm, Bryce Dallas Howard, Mackenzie Davis, Jesse Plemons, entre muitos outros", "emissora": "Channel 4 (2011–2014); Netflix (desde 2016)", "premios": "Vários Emmys, incluindo o de melhor filme para TV com os episódios “San Junipero” (2017) e “USS Callister” (2018).", "parecido": "Além da Imaginação (Twilight Zone), Love, Death & Robots, Years and Years", "episodio": "“San Junipero” (3ª temporada, ep. 4) — o mais querido, e o menos sombrio.", "texto": ["Cada episódio de Black Mirror é uma história fechada, com personagens e época próprios, e o que os une é uma pergunta: o que acontece quando uma tecnologia quase pronta encontra a pior (ou a mais humana) parte de nós? Há redes sociais que viram sistema de notas para a vida inteira, memórias que podem ser gravadas e revistas, mortos que voltam como programas, um jogo em que um funcionário frustrado manda em cópias digitais dos colegas. O criador, o roteirista e humorista britânico Charlie Brooker, começou na TV inglesa e a série ganhou fama mundial quando a Netflix assumiu a produção.", "O título vem da tela escura de qualquer aparelho desligado, onde cada um vê o próprio reflexo — e é isso que a série cobra do espectador. Nem tudo é pessimismo: alguns episódios são histórias de amor ou comédias amargas, e os melhores trabalham a emoção antes do susto. Como a qualidade varia entre capítulos e temporadas, vale escolher a dedo no começo. Para quem não é fã de ficção científica, o recado é tranquilizador: quase nunca se trata de naves ou robôs, e sim de coisas que já estão no seu bolso."]}}, {"rank": 27, "nyt": "Better Call Saul", "anos": "2015–2022", "pt": "Better Call Saul", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Better+Call+Saul", "ficha": {"tagline": "Antes de virar Saul Goodman, Jimmy McGill ainda tentava ser um advogado honesto.", "genero": "Drama policial", "pais": "Estados Unidos", "anos": "2015–2022 · 6 temporadas", "elenco": "Bob Odenkirk, Rhea Seehorn, Jonathan Banks, Michael McKean, Patrick Fabian, Michael Mando, Giancarlo Esposito, Tony Dalton", "emissora": "AMC", "premios": "Mais de 50 indicações ao Emmy e nenhuma vitória, um dos maiores “zeros” da história da premiação.", "parecido": "Breaking Bad, Ozark, Família Soprano", "episodio": "“Chicanery” (3ª temporada, ep. 5), o julgamento mais tenso da série.", "texto": ["Spin-off de Breaking Bad criado por Vince Gilligan e Peter Gould, a série volta ao tempo em que o advogado espalhafatoso Saul Goodman ainda se chamava Jimmy McGill: um defensor público endividado em Albuquerque, que cuida do irmão mais velho, Chuck, brilhante e doente, e tenta subir na vida sem ter pedigree. Ao lado dele aparecem a advogada Kim Wexler, que se torna o coração moral da trama, e o ex-policial Mike Ehrmantraut, que também vem da série original.", "Não é preciso ter visto Breaking Bad para entrar, mas quem viu ganha uma camada extra, porque a graça é acompanhar um homem simpático desistindo, aos poucos, das próprias regras. O ritmo é mais lento e mais detalhista que o da série-mãe, com atenção quase obsessiva a gestos e silêncios, e a relação entre Jimmy e Kim é um dos melhores retratos de casal da TV recente. Bob Odenkirk, até então conhecido como comediante, entrega o papel de sua carreira. Muitos críticos consideram a série tão boa quanto a original, e alguns a preferem."]}}, {"rank": 28, "nyt": "Band of Brothers", "anos": "2001", "pt": "Irmãos de Guerra", "alt": "Irmãos de Armas (Portugal)", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Band+of+Brothers", "ficha": {"tagline": "A história de uma companhia de paraquedistas americanos, do treinamento ao fim da Segunda Guerra.", "genero": "Minissérie de guerra", "pais": "Estados Unidos / Reino Unido", "anos": "2001 · 10 episódios", "elenco": "Damian Lewis, Ron Livingston, Donnie Wahlberg, Scott Grimes, Neal McDonough, David Schwimmer, Michael Fassbender, Tom Hardy, James McAvoy", "emissora": "HBO", "premios": "Emmy e Globo de Ouro de melhor minissérie (2002).", "parecido": "The Pacific, Chernobyl, Generation Kill", "episodio": "“Bastogne” (ep. 6), contado do ponto de vista do médico da companhia.", "texto": ["Baseada no livro do historiador Stephen Ambrose e produzida por Tom Hanks e Steven Spielberg, a minissérie acompanha a Easy Company, unidade de paraquedistas do exército americano, desde o treinamento duríssimo em 1942 até o fim da guerra na Europa. São os pousos na Normandia no Dia D, a batalha de Bastogne no inverno, a chegada a um campo de concentração e, no fim, ao Ninho da Águia, refúgio de Hitler nos Alpes. O líder da companhia é o oficial Richard Winters, interpretado por Damian Lewis.", "Em vez de um herói só, a série distribui o foco: vários episódios giram em torno de um personagem diferente, o que dá a sensação de ver a guerra por muitos pontos de vista. As cenas de combate, feitas com orçamento de cinema, foram marcantes na época, mas é a camaradagem entre os soldados — e a perda de cada um — que fica na memória. Veteranos reais aparecem em depoimentos curtos, que misturam história e emoção. É uma boa porta de entrada para quem não costuma ver filmes de guerra."]}}, {"rank": 29, "nyt": "Key & Peele", "anos": "2012–2015", "pt": "Key & Peele", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Key+%26+Peele", "ficha": null}, {"rank": 30, "nyt": "Severance", "anos": "2022–hoje", "pt": "Ruptura", "alt": "Separação (Portugal)", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Severance", "ficha": null}, {"rank": 31, "nyt": "Survivor", "anos": "2000–hoje", "pt": "Survivor", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Survivor", "ficha": {"tagline": "Estranhos largados numa ilha, uma votação por semana e um milhão de dólares para o último de pé.", "genero": "Reality de competição", "pais": "Estados Unidos", "anos": "2000–hoje · mais de 40 temporadas", "elenco": "Apresentador: Jeff Probst; participantes diferentes a cada temporada", "emissora": "CBS", "premios": "Jeff Probst venceu várias vezes o Emmy de melhor apresentador de reality.", "parecido": "No Limite, The Amazing Race, Big Brother", "episodio": "Comece pela 1ª temporada (Bornéu, 2000), onde tudo começou — ou pela que passar na sua TV hoje.", "texto": ["A versão americana de um formato sueco do final dos anos 1990 reúne um grupo de pessoas comuns num lugar remoto, divide todas em tribos e as obriga a fazer comida, abrigo e fogo sozinhas. A cada semana há provas de resistência e inteligência e, no fim, o grupo vota para eliminar alguém, até restar um vencedor. A primeira temporada, em Bornéu (2000), foi um fenômeno de audiência nos Estados Unidos e fez o reality virar gênero dominante da TV; aqui no Brasil, o formato deu origem ao No Limite, da Globo, que estreou no mesmo ano.", "O que mantém o programa vivo há mais de duas décadas é a mistura de esporte e jogo político: não basta ser forte, é preciso fazer alianças, mentir na medida certa e ser simpático o bastante para não ser o próximo a sair. As temporadas variam de cenário e de regras, o que permite começar por qualquer uma. É diversão de fim de tarde, com algum drama real. Para quem torce o nariz para reality, vale saber que muitos críticos o colocam entre os melhores do gênero."]}}, {"rank": 32, "nyt": "Andor", "anos": "2022–2025", "pt": "Andor", "alt": "Star Wars: Andor", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Andor", "ficha": null}, {"rank": 33, "nyt": "Enlightened", "anos": "2011–2013", "pt": "Enlightened", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Enlightened", "ficha": {"tagline": "Uma executiva que explodiu no trabalho volta do retiro decidida a salvar o mundo — e atrapalha todo mundo.", "genero": "Comédia dramática", "pais": "Estados Unidos", "anos": "2011–2013 · 2 temporadas", "elenco": "Laura Dern, Luke Wilson, Diane Ladd, Mike White, Sarah Burns, Timm Sharp", "emissora": "HBO", "premios": "Globo de Ouro de melhor atriz em comédia ou musical para Laura Dern (2012).", "parecido": "Fleabag, Girls, The White Lotus", "episodio": "O primeiro episódio (“Pilot”), com a crise no escritório.", "texto": ["Amy Jellicoe trabalha numa grande empresa e tem uma crise de nervos pública depois de um caso que acaba mal. Passa semanas numa clínica no Havaí, volta aparentemente em paz e decidida a ser uma pessoa melhor — o que, na prática, significa tentar consertar a mãe, o ex-marido e a empresa onde trabalha, sem que ninguém tenha pedido. A segunda temporada transforma a obsessão dela em uma cruzada contra a própria companhia.", "Escrita por Mike White (o mesmo de The White Lotus) e por Laura Dern, a série vive da dificuldade em decidir se Amy é heroína ou pessoa insuportável, e acerta ao não resolver a dúvida: ela é as duas coisas. Dern, premiada com o Globo de Ouro, está em um de seus melhores papéis, e a mãe da personagem é interpretada por Diane Ladd, que é mãe dela na vida real. Foi cancelada depois de duas temporadas com audiência baixa, mas ganhou fama com o tempo e virou favorita da crítica. São só 18 episódios, de meia hora."]}}, {"rank": 34, "nyt": "Schitt's Creek", "anos": "2015–2020", "pt": "Schitt's Creek", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Schitt%27s+Creek", "ficha": null}, {"rank": 35, "nyt": "True Detective (Season 1)", "anos": "2014", "pt": "True Detective", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=True+Detective+%28Season+1%29", "ficha": {"tagline": "Dois detetives da Louisiana contam, anos depois, o caso de um crime ritual que nunca saiu de dentro deles.", "genero": "Drama policial", "pais": "Estados Unidos", "anos": "2014 · 1ª temporada (8 episódios)", "elenco": "Matthew McConaughey, Woody Harrelson, Michelle Monaghan, Michael Potts", "emissora": "HBO", "premios": "Emmy de direção para Cary Joji Fukunaga (2014).", "parecido": "Mindhunter, Broadchurch, Mare of Easttown", "episodio": "“Who Goes There” (1ª temporada, ep. 4).", "texto": ["Em 2012, dois ex-detetives da polícia da Louisiana, Rust Cohle (Matthew McConaughey) e Marty Hart (Woody Harrelson), são interrogados sobre um caso de 1995: o assassinato ritual de uma jovem, que os ocupou por anos. A história vai e volta entre as duas épocas, e a versão de cada um nem sempre bate com a do outro. A lista do jornal considera só esta primeira temporada, e é só dela que trata esta ficha.", "É uma série policial mais interessada em atmosfera e personagens do que em perseguições: o pântano, as igrejas, os monólogos pessimistas de Cohle, a amizade que se desgasta. A direção de Cary Joji Fukunaga, que dirigiu os oito episódios, rendeu um Emmy, e uma sequência do quarto episódio, filmada em plano contínuo, é das mais comentadas. As temporadas seguintes têm outro elenco e outra história, e são bem mais desiguais. Serve a quem gosta de suspense lento e sombrio; não a quem quer resolução rápida."]}}, {"rank": 36, "nyt": "The Pitt", "anos": "2025–hoje", "pt": "The Pitt", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=The+Pitt", "ficha": null}, {"rank": 37, "nyt": "Battlestar Galactica", "anos": "2005–2009", "pt": "Battlestar Galactica", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Battlestar+Galactica", "ficha": {"tagline": "Os humanos quase foram extintos por suas próprias máquinas e fogem, em busca de um planeta chamado Terra.", "genero": "Ficção científica", "pais": "Estados Unidos", "anos": "2004–2009 · 4 temporadas (após minissérie de 2003)", "elenco": "Edward James Olmos, Mary McDonnell, Katee Sackhoff, Jamie Bamber, Tricia Helfer, James Callis, Grace Park", "emissora": "Sci Fi Channel (mais tarde Syfy)", "premios": "Prêmio Peabody (2005) e Emmys técnicos, como o de efeitos visuais.", "parecido": "The Expanse, Star Trek: Deep Space Nine, Westworld", "episodio": "“33” (1ª temporada, ep. 1) — um dos melhores episódios de abertura da ficção científica.", "texto": ["Refazendo uma série de 1978, Ronald D. Moore parte de um ataque devastador: os Cylons, robôs criados pelos humanos que se rebelaram, destroem as colônias humanas e deixam apenas cerca de 50 mil sobreviventes. Eles fogem numa frota comandada pela nave de guerra Galactica, sob o comando do veterano Adama e da secretária de Educação Laura Roslin, que acaba como presidente por falta de quem ocupe o cargo. Os cylons podem agora ter aparência humana, o que deixa todos suspeitando de todos.", "Mais que batalhas espaciais, a série se interessa por política, religião, medo e tortura, em temas que ecoavam os anos pós-11 de setembro. A câmera instável e os diálogos nervosos dão aspecto de documentário ao futuro distante, e a atuação do elenco é de primeira. A última temporada divide opiniões, mas o conjunto é um dos grandes marcos da ficção científica na TV, que fez muita gente passar a levar o gênero a sério."]}}, {"rank": 38, "nyt": "Homeland", "anos": "2011–2020", "pt": "Homeland: Segurança Nacional", "alt": "Homeland", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Homeland", "ficha": {"tagline": "Uma agente da CIA, instável e brilhante, desconfia do soldado que voltou vivo depois de oito anos de cativeiro.", "genero": "Thriller de espionagem", "pais": "Estados Unidos", "anos": "2011–2020 · 8 temporadas", "elenco": "Claire Danes, Damian Lewis, Mandy Patinkin, Rupert Friend, Morena Baccarin, F. Murray Abraham", "emissora": "Showtime", "premios": "Emmy de melhor série dramática em 2012, com prêmios também para Claire Danes (atriz), Damian Lewis (ator) e para o roteiro do piloto.", "parecido": "24 Horas, The Americans, Fauda", "episodio": "O piloto (1ª temporada, ep. 1), premiado com o Emmy de roteiro.", "texto": ["Carrie Mathison é analista da CIA, tem transtorno bipolar escondido dos chefes e uma suspeita que ninguém quer ouvir: o sargento Nicholas Brody, fuzileiro naval dado como morto e resgatado depois de oito anos preso pela Al-Qaeda, pode ter sido convertido e voltado aos Estados Unidos para um atentado. A série, adaptada de uma produção israelense, começa como um jogo de gato e rato entre os dois, e Carrie passa a ser, ao mesmo tempo, a única pessoa que enxerga o perigo e a menos confiável para dizer isso.", "O tema é a paranoia da era pós-11 de setembro, e a série acerta ao deixar o espectador em dúvida sobre quem está certo. Claire Danes é o centro de tudo e levou o Emmy pelo papel, e Mandy Patinkin faz o mentor Saul, o coração da série. Depois de uma primeira temporada quase perfeita, o enredo vai ao Oriente Médio, a Berlim e a Washington, com altos e baixos de qualidade. Quem gosta de suspense político com personagens complexos deve ver ao menos as duas primeiras temporadas."]}}, {"rank": 39, "nyt": "Watchmen", "anos": "2019", "pt": "Watchmen", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Watchmen", "ficha": null}, {"rank": 40, "nyt": "Adolescence", "anos": "2025", "pt": "Adolescência", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Adolescence", "ficha": null}, {"rank": 41, "nyt": "Louie", "anos": "2010–2015", "pt": "Louie", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Louie", "ficha": {"tagline": "Um comediante divorciado de Nova York conta a própria vida em episódios que viram contos, fábulas e pesadelos.", "genero": "Comédia dramática", "pais": "Estados Unidos", "anos": "2010–2015 · 5 temporadas", "elenco": "Louis C.K., Pamela Adlon, Hadley Delany, Ursula Parker; participação de David Lynch", "emissora": "FX", "premios": "Emmy de melhor roteiro de comédia para Louis C.K. (2012).", "parecido": "Fleabag, Atlanta, Curb Your Enthusiasm", "episodio": "“Late Show”, trilogia de episódios da 3ª temporada (eps. 10 a 12).", "texto": ["Louis C.K. escreve, dirige, edita e estrela esta comédia sobre um humorista que se vira como pode: cria duas filhas, tenta namorar, trabalha em clubes de stand-up e enfrenta o mundo com mais ironia do que sorte. Cada episódio mostra trechos de uma apresentação landeses e, mais tarde, de políticos e fascistas. O nome, diz a lenda, vem de lâminas escondidas em bonés.", "A série deixa a verdade histórica em segundo plano para fazer um espetáculo de estilo: câmera lenta, uma luz de fim de mundo e uma trilha com rock moderno (Nick Cave, Arctic Monkeys, PJ Harvey) tocando em plena Inglaterra dos anos 1920. Cillian Murphy faz de Tommy um homem frio e melancólico, de olhar azul e sorriso raro, e Helen McCrory, como a tia Polly, rouba cada cena em que aparece. Algumas temporadas são mais fortes que outras, mas poucas séries criaram uma identidade tão forte e tão facilmente copiável."]}}, {"rank": 44, "nyt": "BoJack Horseman", "anos": "2014–2020", "pt": "BoJack Horseman", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=BoJack+Horseman", "ficha": null}, {"rank": 45, "nyt": "Happy Valley", "anos": "2014–2023", "pt": "Happy Valley", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Happy+Valley", "ficha": {"tagline": "Uma sargento de polícia, avó e exausta, enfrenta o homem que destruiu a família dela.", "genero": "Drama policial", "pais": "Reino Unido", "anos": "2014–2023 · 3 temporadas", "elenco": "Sarah Lancashire, James Norton, Siobhan Finneran, Charlie Murphy, George Costigan, Con O’Neill", "emissora": "BBC One", "premios": "BAFTA TV de melhor série dramática; Sarah Lancashire ganhou o BAFTA de melhor atriz (2017 e 2024).", "parecido": "Broadchurch, Line of Duty, Mare of Easttown", "episodio": "O primeiro episódio (1ª temporada, ep. 1) mostra tudo o que a série tem de melhor.", "texto": ["Catherine Cawood é sargento de polícia no vale de Calder, no norte da Inglaterra, e cria o neto sozinha depois do suicídio da filha. O homem que ela culpa por essa tragédia, o criminoso Tommy Lee Royce, volta a cruzar o seu caminho, e um sequestro mal planejado por pequenos bandidos acaba virando a crise que ela precisa resolver. O nome vem de um apelido irônico dado pelos moradores à região, castigada pelas drogas.", , Alan Cumming", "emissora": "CBS", "premios": "Emmys de atuação para Julianna Margulies (2011) e Archie Panjabi (2010).", "parecido": "The Good Fight, Damages, Suits", "episodio": "O piloto.", "texto": ["Depois de um escândalo político que derruba o marido, promotor de Chicago, Alicia Florrick (Julianna Margulies) precisa voltar a advogar, depois de anos longe da profissão. Entra num escritório como a novata de uma equipe de rivais, enquanto o casamento e a imagem pública dela viram assunto nacional.", "Cada episódio traz um caso jurídico da semana, mas o que prende é a política, de tribunal e de eleição, e as relações de poder entre os personagens. O elenco de apoio, com Christine Baranski e Alan Cumming, é tão forte quanto a protagonista, e há uma reviravolta no meio da série que dividiu os fãs. Serve a quem gosta de drama adulto, diálogos inteligentes e tramas longas; não é para quem quer ação. As primeiras temporadas são as mais elogiadas."]}}, {"rank": 80, "nyt": "How To With John Wilson", "anos": "2020–2023", "pt": "How To with John Wilson", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=How+To+With+John+Wilson", "ficha": null}, {"rank": 81, "nyt": "The Queen's Gambit", "anos": "2020", "pt": "O Gambito da Rainha", "alt": "Gambito de Dama (Portugal)", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=The+Queen%27s+Gambit", "ficha": null}, {"rank": 82, "nyt": "Better Things", "anos": "2016–2022", "pt": "Better Things", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Better+Things", "ficha": null}, {"rank": 83, "nyt": "Justified", "anos": "2010–2015", "pt": "Justified", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Justified", "ficha": {"tagline": "Um delegado federal de chapéu de caubói volta para o Kentucky onde cresceu, e o passado o espera.", "genero": "Policial (faroeste moderno)", "pais": "Estados Unidos", "anos": "2010–2015 · 6 temporadas", "elenco": "Timothy Olyphant, Walton Goggins, Nick Searcy, Joelle Carter, Margo Martindale", "emissora": "FX", "premios": "Emmy de atriz coadjuvante para Margo Martindale (2011).", "parecido": "Deadwood, Fargo, The Shield", "episodio": "O piloto (“Fire in the Hole”).", "texto": ["Raylan Givens (Timothy Olyphant) é um delegado federal de chapéu de caubói e pontaria rápida que, depois de um tiroteio, é mandado de volta à terra natal, o condado de Harlan, no Kentucky, uma região pobre de mineração. Lá reencontra velhos conhecidos, entre eles Boyd Crowder (Walton Goggins), amigo de juventude que agora está do outro lado da lei. A série parte de histórias de Elmore Leonard.", "É um faroeste moderno, com diálogos cheios de sotaque e humor seco, em que a graça está nas conversas tanto quanto nos tiros. Os vilões de cada temporada são marcantes, e a dupla Raylan e Boyd é um dos melhores duelos da TV recente. Serve a quem gosta de policial com humor e de histórias de interior; menos a quem prefere tramas muito complicadas."]}}, {"rank": 84, "nyt": "Planet Earth", "anos": "2006", "pt": "Planeta Terra", "alt": "Planet Earth", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Planet+Earth", "ficha": {"tagline": "A natureza do planeta inteiro, filmada como nunca antes, com a voz de David Attenborough.", "genero": "Documentário de natureza", "pais": "Reino Unido", "anos": "2006 · 11 episódios", "elenco": "David Attenborough (narrador)", "emissora": "BBC", "premios": "Vários prêmios Emmy e BAFTA.", "parecido": "Planet Earth II, Our Planet, Cosmos", "episodio": "“From Pole to Pole” (1º episódio).", "texto": ["Série documental da BBC, narrada por David Attenborough, que percorre o planeta em onze episódios, cada um dedicado a um tipo de ambiente: montanhas, desertos, selvas, cavernas, mares profundos, regiões polares. Levou cerca de cinco anos para ser filmada e foi uma das primeiras produções do gênero gravadas em alta definição.", "O que a destaca é a imagem: câmeras estabilizadas em helicópteros, imagens em câmera lenta e acelerada mostram bic d/?s=tt&ttype=tv&q=Shogun", "ficha": {"tagline": "Um navegador inglês naufraga no Japão de 1600 e cai no meio de uma disputa pelo poder.", "genero": "Drama histórico", "pais": "Estados Unidos", "anos": "2024–atual", "elenco": "Hiroyuki Sanada, Cosmo Jarvis, Anna Sawai, Tadanobu Asano", "emissora": "FX (Hulu)", "premios": "18 Emmys em 2024, incluindo melhor série dramática, melhor ator (Hiroyuki Sanada) e melhor atriz (Anna Sawai).", "parecido": "Game of Thrones, The Last Kingdom, Vikings", "episodio": "O primeiro episódio (“Anjin”).", "texto": ["Japão, ano de 1600: o país está à beira de uma guerra civil entre senhores poderosos, e o piloto inglês John Blackthorne (Cosmo Jarvis) naufraga na costa com uma tripulação à beira da fome. Preso como estrangeiro suspeito, cai nas mãos do senhor Toranaga (Hiroyuki Sanada), um estrategista que enfrenta rivais no conselho de regentes, e da intérprete Mariko (Anna Sawai).", "É um drama político e histórico, de intrigas e choque entre culturas, baseado no romance de James Clavell, de 1975. Muito do diálogo é em japonês, com legendas, e a produção foi elogiada pelo cuidado com cenários, figurinos e costumes da época. Serve a quem gosta de drama histórico e de ritmo contido; não a quem quer ação o tempo todo. Não é preciso conhecer o livro nem a minissérie de 1980."]}}, {"rank": 87, "nyt": "Reservation Dogs", "anos": "2021–2023", "pt": "Reservation Dogs", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Reservation+Dogs", "ficha": null}, {"rank": 88, "nyt": "Dexter", "anos": "2006–2013", "pt": "Dexter", "alt": "", "imdb": "https://www.imdb.com/find/?s=tt&ttype=tv&q=Dexter", "ficha": {"tagline": "Um perito da polícia de Miami, simpático e discreto, esconde que é um assassino em série com código de conduta.", "genero": "Drama policial", "pais": "Estados Unidos", "anos": "2006–2013 · 8 temporadas", "elenco": "Michael C. Hall, Jennifer Carpenter, Julie Benz, David Zayas, Lauren Vélez, James Remar, John Lithgow", "emissor
