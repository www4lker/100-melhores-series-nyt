<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Os 100 melhores programas de TV do século XXI</title>
<meta name="description" content="A lista do The New York Times com os 100 melhores programas de TV do século XXI, em português, com fichas e resenhas dos 25 primeiros. Marque o que já viu e o que quer ver.">
<style>
:root{
  --paper:#f4efe4; --paper2:#ebe4d4; --ink:#1d1b17; --ink2:#5b564b; --rule:#cfc6b2;
  --blue:#1f3a5f; --green:#2f6b3a; --amber:#9a5b05; --red:#a3271c; --card:#fbf8f0;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#17150f; --paper2:#201d15; --ink:#ece6d6; --ink2:#a39b88; --rule:#3a3528;
  --blue:#8fb2e6; --green:#7cc58a; --amber:#e0a14a; --red:#ee7d70; --card:#1d1a12}
}
:root[data-theme="dark"]{--paper:#17150f; --paper2:#201d15; --ink:#ece6d6; --ink2:#a39b88; --rule:#3a3528;
  --blue:#8fb2e6; --green:#7cc58a; --amber:#e0a14a; --red:#ee7d70; --card:#1d1a12}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans)}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}
/* topo */
header.top{padding:14px 16px 10px;border-bottom:2px solid var(--ink);display:grid;gap:10px}
.titlebar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
h1{font:700 clamp(20px,3.2vw,28px)/1.1 var(--serif);margin:0;letter-spacing:-.01em}
h1 small{display:block;font:400 13px/1.35 var(--sans);color:var(--ink2);margin-top:5px;letter-spacing:0}
.counts{display:flex;flex-wrap:wrap;gap:4px 16px;font:12px var(--mono);color:var(--ink2)}
.counts b{color:var(--ink);font-weight:700}
.bar{height:6px;background:var(--paper2);border:1px solid var(--rule);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--green);width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--ink);background:var(--card);border-radius:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--ink);background:transparent;padding:5px 9px;font:12px var(--mono);cursor:pointer;border-radius:0}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--ink);background:var(--card);padding:5px 10px;font:12px var(--mono);cursor:pointer;border-radius:0}
.btn:hover{background:var(--paper2)}
/* layout */
main{display:grid;grid-template-columns:minmax(360px,40%) 1fr;min-height:calc(100vh - 140px)}
#list{border-right:1px solid var(--ink);max-height:calc(100vh - 140px);overflow:auto;position:sticky;top:0;align-self:start}
.lhead,.row{display:grid;grid-template-columns:38px 1fr 28px 28px;gap:6px;align-items:center;padding:7px 10px}
.lhead{position:sticky;top:0;background:var(--paper2);border-bottom:1px solid var(--ink);font:10px var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;z-index:2}
.lhead span:nth-child(n+3){text-align:center}
.row{border-bottom:1px solid var(--rule);cursor:pointer;background:transparent}
.row:hover{background:var(--paper2)}
.row[aria-selected=true]{background:var(--card);box-shadow:inset 4px 0 0 var(--blue)}
.rk{font:700 17px var(--mono);text-align:right;color:var(--ink2)}
.tt{min-width:0}
.tt .pt{font:700 15px/1.2 var(--serif);display:block}
.tt .en{font:11px var(--mono);color:var(--ink2);display:block;margin-top:2px}
.tt .yr{font:11px var(--mono);color:var(--ink2)}
.stamp{display:inline-block;border:1.5px solid currentColor;padding:0 4px;margin-left:6px;font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;color:var(--green);vertical-align:1px}
.row input[type=checkbox]{width:18px;height:18px;margin:0 auto;display:block;accent-color:var(--blue);cursor:pointer}
.empty{padding:24px 14px;color:var(--ink2);font:13px var(--mono)}
/* detalhe */
#detail{padding:18px clamp(14px,3vw,32px) 60px;min-width:0}
.d-rank{font:700 12px var(--mono);color:var(--ink2);letter-spacing:.06em}
.d-title{font:700 clamp(24px,3.4vw,36px)/1.08 var(--serif);margin:2px 0 4px;letter-spacing:-.01em}
.d-sub{font:13px var(--mono);color:var(--ink2);margin:0 0 8px}
.tagline{font:italic 400 clamp(16px,2vw,19px)/1.4 var(--serif);margin:0 0 14px;max-width:60ch}
.card{background:var(--card);border:1px solid var(--ink);margin:12px 0}
.card h3{margin:0;padding:5px 10px;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--ink);background:var(--paper2);display:flex;justify-content:space-between;gap:8px}
dl.f{display:grid;grid-template-columns:max-content 1fr;margin:0}
dl.f dt,dl.f dd{margin:0;padding:5px 10px;border-bottom:1px solid var(--rule)}
dl.f dt{font:11px var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;padding-right:14px}
dl.f dd{font-size:14px}
dl.f > :nth-last-child(-n+2){border-bottom:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px}
.checks label{display:flex;gap:7px;align-items:center;font:13px var(--mono);cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--blue)}
textarea.note{width:calc(100% - 20px);margin:0 10px 10px;min-height:56px;padding:6px 8px;border:1px solid var(--rule);background:var(--paper);resize:vertical;font-size:14px}
.txt{padding:14px clamp(12px,3vw,26px);font:16px/1.65 var(--serif);max-width:72ch}
.txt p{margin:0 0 .85em}
.txt p:last-child{margin-bottom:0}
.nav{display:flex;gap:6px;margin:0 0 12px}
.none{padding:14px 12px;font-size:14px;max-width:62ch}
.none b{font-family:var(--serif)}
.backbtn{display:none}
.foot{padding:16px;border-top:1px solid var(--rule);font:12px/1.55 var(--sans);color:var(--ink2);max-width:90ch}
.foot p{margin:0 0 .6em}
@media (max-width:900px){
  main{grid-template-columns:1fr}
  #list{max-height:none;position:static;border-right:0}
  #detail{display:none;position:fixed;inset:0;z-index:20;background:var(--paper);overflow:auto;padding-top:10px}
  body.showdetail #detail{display:block}
  body.showdetail{overflow:hidden}
  .backbtn{display:inline-block}
  .lhead,.row{grid-template-columns:34px 1fr 26px 26px;gap:4px;padding:7px 8px}
  dl.f{grid-template-columns:1fr}
  dl.f dt{border-bottom:0;padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.tools,#list,.nav,.checks{display:none}main{display:block}#detail{display:block}}
</style>
</head>

<script id="dados" type="application/json">{"items": [{"rank": 1, "nyt": "Breaking Bad", "anos": "2008–2013", "pt": "Breaking Bad", "alt": "", "ficha": {"tagline": "Um professor de química comum vira, passo a passo, o pior de si mesmo.", "genero": "Drama policial", "pais": "Estados Unidos", "anos": "2008–2013 · 5 temporadas", "elenco": "Bryan Cranston, Aaron Paul, Anna Gunn, Dean Norris, Bob Odenkirk, Betsy Brandt, RJ Mitte, Giancarlo Esposito", "emissora": "AMC", "premios": "16 Emmys, incluindo melhor série dramática em 2013 e 2014; quatro Emmys de melhor ator para Bryan Cranston.", "parecido": "Família Soprano, Better Call Saul, Ozark", "episodio": "“Ozymandias” (5ª temporada, ep. 14) — veja só depois de chegar lá.", "texto": ["Walter White tem cinquenta anos, dá aulas de química a adolescentes desinteressados, faz bico num lava-rápido e acaba de receber o diagnóstico de um câncer de pulmão. Sem dinheiro para o tratamento e com um filho com paralisia cerebral e outro a caminho, ele decide usar o único talento que lhe resta: fabricar metanfetamina de pureza raríssima, ao lado de um ex-aluno, Jesse Pinkman. A ideia é deixar algum dinheiro para a família e sair de cena.", "O que Vince Gilligan criou não é a história de um homem bom empurrado para o crime. É o inverso: a série mostra o orgulho, o ressentimento e a vaidade de Walter vindo à tona e encontrando, no mundo das drogas, o primeiro palco em que ele é o melhor em alguma coisa. A mudança é lenta, e por isso convence — cada decisão parece razoável no momento em que é tomada. Bryan Cranston, até então mais lembrado como o pai de uma comédia, sustenta isso com uma atuação que dá medo, e Aaron Paul é o contraponto emocional. Com roteiros muito bem amarrados, cenas de tensão que funcionam como mecanismos de relógio e a paisagem seca do Novo México como marca visual, é uma das poucas séries que terminam à altura do que prometeram."]}}, {"rank": 2, "nyt": "The Wire", "anos": "2002–2008", "pt": "A Escuta", "alt": "", "ficha": {"tagline": "Baltimore vista de cima a baixo: da esquina do tráfico ao gabinete do prefeito.", "genero": "Drama policial", "pais": "Estados Unidos", "anos": "2002–2008 · 5 temporadas", "elenco": "Dominic West, Lance Reddick, Sonja Sohn, Wendell Pierce, Clarke Peters, Idris Elba, Michael K. Williams, Andre Royo, Wood Harris, Aidan Gillen", "emissora": "HBO", "premios": "Nunca ganhou um Emmy — omissão que virou símbolo de injustiça entre críticos e fãs.", "parecido": "Família Soprano, Deadwood, The Shield: Acima da Lei", "episodio": "“Middle Ground” (3ª temporada, ep. 11).", "texto": ["Criada por David Simon, ex-repórter policial do jornal The Baltimore Sun, e pelo ex-policial Ed Burns, A Escuta começa como uma investigação: uma equipe de detetives grampeia telefones para derrubar uma quadrilha do tráfico em Baltimore. Mas cada temporada alarga o enquadramento. Depois dos policiais e dos traficantes, a série passa pelo porto, pela prefeitura, pelas escolas públicas e pela redação de um jornal, até compor um retrato de como as instituições de uma grande cidade americana falham juntas.", "Não é série para ver distraído. Há pouca explicação, muita gíria e dezenas de personagens, e a recompensa chega devagar — mas chega. Seu maior mérito é recusar a divisão entre mocinhos e bandidos: policiais acomodados, políticos oportunistas e criminosos com código de honra dividem o mesmo quadro, todos presos a sistemas maiores que eles. Entre os personagens mais lembrados estão o detetive McNulty, o chefão Stringer Bell e Omar, o assaltante que só rouba traficantes."]}}, {"rank": 3, "nyt": "Mad Men", "anos": "2007–2015", "pt": "Mad Men: Inventando Verdades", "alt": "", "ficha": {"tagline": "Publicitários dos anos 1960 vendem o sonho americano e escondem o próprio pesadelo.", "genero": "Drama", "pais": "Estados Unidos", "anos": "2007–2015 · 7 temporadas", "elenco": "Jon Hamm, Elisabeth Moss, John Slattery, Vincent Kartheiser, January Jones, Christina Hendricks, Jared Harris, Robert Morse", "emissora": "AMC", "premios": "16 Emmys, incluindo quatro vezes seguidas o de melhor série dramática (2008–2011); Globo de Ouro de melhor série dramática em 2008, 2009 e 2010.", "parecido": "Halt and Catch Fire, Succession, The Americans: Rede de Espionagem", "episodio": "“The Suitcase” (4ª temporada, ep. 7).", "texto": ["Nova York, 1960. Don Draper é o publicitário mais admirado da agência Sterling Cooper, na Madison Avenue: elegante, talentoso, com casa no subúrbio, mulher bonita e filhos. Só que “Don Draper” é uma identidade emprestada, e o que parece sucesso é uma construção cuidadosa para esconder quem ele foi. A série de Matthew Weiner acompanha a agência ao longo da década, enquanto a América dos cigarros em todas as mesas e dos almoços com martíni dá lugar à dos direitos civis, da contracultura e do feminismo.", "Mad Men é lenta de propósito. As cenas se constroem de pausas, olhares e frases que dizem o contrário do que parecem, e a reconstituição de época — ternos, móveis, tipografia — é tão minuciosa que influenciou moda e design. Sob o verniz, a série trata de reinvenção e solidão, e dá atenção especial a Peggy Olson (Elisabeth Moss), que sobe de secretária a redatora num meio hostil às mulheres. Foi também a série que firmou o canal AMC como casa de dramas de prestígio."]}}, {"rank": 4, "nyt": "Succession", "anos": "2018–2023", "pt": "Succession", "alt": "", "ficha": {"tagline": "Uma família bilionária disputa o trono do império — e ninguém sabe amar sem negociar.", "genero": "Drama com humor ácido", "pais": "Estados Unidos", "anos": "2018–2023 · 4 temporadas", "elenco": "Brian Cox, Jeremy Strong, Sarah Snook, Kieran Culkin, Alan Ruck, Matthew Macfadyen, Nicholas Braun, J. Smith-Cameron", "emissora": "HBO", "premios": "Emmy de melhor série dramática três vezes (2020, 2022 e 2024).", "parecido": "Veep, Mad Men: Inventando Verdades, The Thick of It", "episodio": "“Connor’s Wedding” (4ª temporada, ep. 9).", "texto": ["Logan Roy, fundador de um conglomerado de mídia que lembra bastante o império de Rupert Murdoch, está velho e doente, e seus filhos adultos disputam — com mais ou menos disfarce — o direito de herdar a empresa. Criada pelo britânico Jesse Armstrong, que também escreveu The Thick of It, a série troca o brilho habitual das histórias de ricos por algo mais corrosivo: aqui o dinheiro não compra afeto, só protege os personagens das consequências.", "Funciona como comédia e como tragédia ao mesmo tempo. Os diálogos, cheios de insultos elaborados, rendem risadas incômodas, e o elenco — com destaque para Brian Cox, Sarah Snook, Kieran Culkin e Jeremy Strong — transforma cada reunião de família num pequeno campo de batalha. A trilha de Nicholas Britell, que mistura cordas graves e batidas de hip-hop, dá o tom. Terminou em quatro temporadas, no auge, o que é raro."]}}, {"rank": 5, "nyt": "Fleabag", "anos": "2016–2019", "pt": "Fleabag", "alt": "", "ficha": {"tagline": "Uma londrina que fala com a câmera para não ter que falar com ninguém.", "genero": "Comédia dramática", "pais": "Reino Unido", "anos": "2016–2019 · 2 temporadas", "elenco": "Phoebe Waller-Bridge, Sian Clifford, Olivia Colman, Bill Paterson, Brett Gelman, Andrew Scott, Hugh Skinner", "emissora": "BBC Three (1ª temporada) e BBC One (2ª), em coprodução com a Amazon", "premios": "Emmys de melhor série de comédia, melhor atriz de comédia e melhor roteiro de comédia em 2019.", "parecido": "Girls, Catastrophe, I May Destroy You", "episodio": "Episódio 1 da 2ª temporada.", "texto": ["Fleabag é o apelido de uma londrina de trinta e poucos anos que toca um café temático de porquinhos-da-índia em dificuldades, leva uma vida sexual sem muito critério e finge que está tudo bem. Enquanto isso, olha para a câmera e comenta o que acontece, como se o espectador fosse a única pessoa a quem ela diz a verdade. Phoebe Waller-Bridge adaptou para a TV a peça solo que escreveu e estrelou, e fez da quebra da “quarta parede” o motor da história: o que a personagem esconde de quem a assiste importa mais do que qualquer reviravolta.", "Cada temporada tem seis episódios curtos, quase sem gordura. Rindo de sexo, família e luto, a série vai deixando ver uma tristeza que a protagonista evita encarar. A segunda temporada, com a chegada de um padre vivido por Andrew Scott, é frequentemente citada entre as melhores de qualquer comédia recente."]}}, {"rank": 6, "nyt": "Game of Thrones", "anos": "2011–2019", "pt": "Game of Thrones", "alt": "A Guerra dos Tronos (Portugal)", "ficha": {"tagline": "Reinos em guerra por um trono de espadas, com o inverno — e os dragões — a caminho.", "genero": "Fantasia épica", "pais": "Estados Unidos", "anos": "2011–2019 · 8 temporadas", "elenco": "Peter Dinklage, Lena Headey, Emilia Clarke, Kit Harington, Sophie Turner, Maisie Williams, Nikolaj Coster-Waldau, Sean Bean, Charles Dance, Iain Glen", "emissora": "HBO", "premios": "59 Emmys, o maior número já conquistado por uma série dramática; melhor série dramática em 2015, 2016, 2018 e 2019.", "parecido": "A Casa do Dragão, The Last Kingdom, Vikings", "episodio": "“Hardhome” (5ª temporada, ep. 8).", "texto": ["Baseada na saga literária As Crônicas de Gelo e Fogo, de George R. R. Martin, a série acompanha várias casas nobres de Westeros disputando o Trono de Ferro. Ao mesmo tempo, no extremo norte, uma ameaça antiga volta a se mexer, e do outro lado do mar uma jovem exilada, Daenerys Targaryen, reúne exércitos e dragões para reclamar o reino que foi da família. A inspiração vem de guerras medievais reais, em especial a Guerra das Duas Rosas, na Inglaterra.", "O que a transformou em fenômeno foi a mistura de escala de cinema com a coragem de matar personagens importantes sem aviso, o que fazia de cada episódio um acontecimento. Idiomas inventados para a série, como o dothraki, efeitos especiais caros e um elenco enorme sustentaram as primeiras temporadas, as mais admiradas; as últimas dividiram o público. Seja como for, mudou o que as emissoras achavam possível fazer em televisão."]}}, {"rank": 7, "nyt": "Veep", "anos": "2012–2019", "pt": "Veep", "alt": "", "ficha": {"tagline": "A vice-presidente dos Estados Unidos tem muito título e pouquíssimo poder.", "genero": "Comédia política (sátira)", "pais": "Estados Unidos", "anos": "2012–2019 · 7 temporadas", "elenco": "Julia Louis-Dreyfus, Tony Hale, Anna Chlumsky, Reid Scott, Matt Walsh, Timothy Simons, Kevin Dunn, Sam Richardson", "emissora": "HBO", "premios": "Emmy de melhor série de comédia em 2015, 2016 e 2017; seis Emmys seguidos de melhor atriz de comédia para Julia Louis-Dreyfus.", "parecido": "The Thick of It, Succession, Um Maluco na TV", "episodio": "", "texto": ["Selina Meyer foi senadora, disputou a presidência e acabou vice-presidente dos Estados Unidos, um cargo que rende mais cerimônias do que decisões. Criada pelo britânico Armando Iannucci, a série acompanha a vice e sua equipe de assessores, que passam os dias tentando fazer a chefe parecer competente, simpática e decente — e fracassando de maneiras sempre criativas. O humor vem sobretudo dos xingamentos: o roteiro tem uma musicalidade de palavrão que virou marca registrada.", "Julia Louis-Dreyfus, que já era estrela desde Seinfeld, dá a Selina uma mistura irresistível de vaidade, desespero e ambição. Sem heróis nem moral da história, a série ri da política americana por dentro, e, conforme a realidade foi ficando cada vez mais absurda, a ficção passou a ter dificuldade de competir — o que não a impediu de terminar bem."]}}, {"rank": 8, "nyt": "30 Rock", "anos": "2006–2013", "pt": "Um Maluco na TV", "alt": "", "ficha": {"tagline": "Os bastidores de um programa de humor, tocados por gente que nunca deveria estar no comando.", "genero": "Comédia", "pais": "Estados Unidos", "anos": "2006–2013 · 7 temporadas", "elenco": "Tina Fey, Alec Baldwin, Tracy Morgan, Jane Krakowski, Jack McBrayer, Scott Adsit, Judah Friedlander", "emissora": "NBC", "premios": "16 Emmys, incluindo melhor série de comédia três anos seguidos (2007 a 2009).", "parecido": "Confusões de Leslie, Arrested Development, Community", "episodio": "", "texto": ["O título é o endereço da sede da NBC em Nova York, 30 Rockefeller Plaza. Tina Fey, que foi roteirista-chefe do Saturday Night Live, criou uma comédia ambientada num programa de esquetes fictício e interpreta Liz Lemon, a roteirista-chefe sensata e permanentemente exausta que tenta manter a ordem enquanto todos ao redor são mais malucos do que ela: uma estrela vaidosa e carente (Jane Krakowski), um comediante imprevisível (Tracy Morgan), um contínuo caipira, devoto da emissora (Jack McBrayer) e um executivo implacável (Alec Baldwin).", "O ritmo é frenético: há piada em quase toda fala, gags visuais no fundo das cenas e referências que a série dispara e abandona antes que o espectador as alcance. Funciona também como sátira dos bastidores da própria televisão — e do canal que a exibia."]}}, {"rank": 9, "nyt": "Curb Your Enthusiasm", "anos": "2000–2024", "pt": "Curb Your Enthusiasm", "alt": "Segura a Onda (título de exibição no Brasil", "ficha": {"tagline": "Larry David vive em Los Angeles e briga com as regras sociais que todo mundo finge respeitar.", "genero": "Comédia", "pais": "Estados Unidos", "anos": "2000–2024 · 12 temporadas", "elenco": "Larry David, Jeff Garlin, Cheryl Hines, Susie Essman, J. B. Smoove, Richard Lewis", "emissora": "HBO", "premios": "Globo de Ouro de melhor série de comédia e dois Emmys, além de dezenas de indicações.", "parecido": "Seinfeld, Louie, The Office (Reino Unido)", "episodio": "", "texto": ["Larry David, cocriador de Seinfeld, interpreta uma versão exagerada de si mesmo: milionário rabugento de Los Angeles, incapaz de deixar passar um deslize de etiqueta. Cada episódio parte de um pequeno incômodo — um convite para jantar, uma ligação mal atendida, uma fila — e vai se complicando numa cadeia de mal-entendidos que costuma se fechar de forma engenhosa no último minuto.", "Os diálogos são em grande parte improvisados a partir de um esqueleto de cena, o que dá aos atores um ritmo de conversa real, e não há trilha de risadas. O humor depende de você aceitar a lógica do protagonista, que está sempre certo na regra e errado na hora, e por isso entrega o prazer de dizer em voz alta o que ninguém diz. Foi ao ar, com pausas, por mais de duas décadas."]}}, {"rank": 10, "nyt": "Atlanta", "anos": "2016–2022", "pt": "Atlanta", "alt": "", "ficha": {"tagline": "Dois primos tentam abrir caminho na cena musical de Atlanta — e a série vira o que quiser a cada episódio.", "genero": "Comédia dramática", "pais": "Estados Unidos", "anos": "2016–2022 · 4 temporadas", "elenco": "Donald Glover, Brian Tyree Henry, Lakeith Stanfield, Zazie Beetz", "emissora": "FX", "premios": "Donald Glover ganhou os Emmys de melhor ator e de melhor direção de comédia (2017) e a série levou o Globo de Ouro de melhor série de comédia no mesmo ano.", "parecido": "Louie, Barry, Insecure", "episodio": "“Teddy Perkins” (2ª temporada, ep. 6).", "texto": ["Earn (Donald Glover) largou a faculdade, vive de bicos e dorme ora na casa da ex, ora na da família. Quando seu primo Alfred, que rima sob o nome de Paper Boi (Brian Tyree Henry), começa a ficar conhecido na cidade, Earn se oferece como empresário. A premissa é simples, mas Glover — que criou, escreveu e estrelou a série, com direção de Hiro Murai em boa parte dos episódios — a usa como ponto de partida para falar de dinheiro, raça, fama e a vida de quem está perto do sucesso sem chegar nele.", "O tom muda de um episódio para outro: há capítulos realistas, outros de humor absurdo, um quase de terror e um falso documentário sobre uma emissora que só existe naquele universo. A terceira temporada leva os personagens a uma turnê pela Europa, e a quarta volta a Atlanta. Em vez de uma trama linear, a série oferece um retrato atento de um lugar e de uma geração, com a ironia de quem vê o mundo de uma esquina e o desconforto de saber que as coisas não vão se resolver."]}}, {"rank": 11, "nyt": "The Office (U.S.)", "anos": "2005–2013", "pt": "The Office (EUA)", "alt": "", "ficha": {"tagline": "Um escritório de papel em Scranton, onde o chefe quer ser amado e os funcionários só querem ir para casa.", "genero": "Comédia (falso documentário)", "pais": "Estados Unidos", "anos": "2005–2013 · 9 temporadas", "elenco": "Steve Carell, Rainn Wilson, John Krasinski, Jenna Fischer, B. J. Novak, Mindy Kaling, Ed Helms, Angela Kinsey", "emissora": "NBC", "premios": "Emmy de melhor série de comédia (2006) e Globo de Ouro de melhor ator de comédia para Steve Carell (2006).", "parecido": "The Office (Reino Unido), Confusões de Leslie, Família Moderna", "episodio": "“Dinner Party” (4ª temporada, ep. 13).", "texto": ["A versão americana nasceu como adaptação da série britânica de Ricky Gervais, mas demorou um pouco a achar a própria voz. Nas primeiras temporadas, o chefe Michael Scott (Steve Carell) era uma cópia mais cruel de David Brent; a partir da segunda, ganhou o coração que o original nunca teve. O resultado é uma comédia de escritório em que o constrangimento convive com carinho: Michael é insuportável, mas quer desesperadamente ter amigos, e a equipe da filial de Scranton da Dunder Mifflin acaba, a contragosto, gostando dele.", "Filmada como se uma equipe de documentário acompanhasse o expediente, a série vive de olhares para a câmera, de pequenos rituais de escritório e de personagens que vão ficando mais profundos com o tempo, como o vendedor Jim, a recepcionista Pam e o bajulador Dwight. É uma das comédias mais revistas da televisão americana."]}}, {"rank": 12, "nyt": "Arrested Development", "anos": "2003–2019", "pt": "Arrested Development", "alt": "Caindo na Real (BR) · De Mal a Pior (Portugal)", "ficha": {"tagline": "Uma família rica e desastrada perde tudo — menos o hábito de se atrapalhar.", "genero": "Comédia", "pais": "Estados Unidos", "anos": "2003–2019 · 5 temporadas", "elenco": "Jason Bateman, Portia de Rossi, Will Arnett, Michael Cera, Alia Shawkat, Tony Hale, David Cross, Jeffrey Tambor, Jessica Walter", "emissora": "Fox (3 primeiras temporadas) e Netflix (as duas últimas)", "premios": "Seis Emmys, incluindo melhor série de comédia (2004); Globo de Ouro de melhor ator de comédia para Jason Bateman (2005).", "parecido": "Um Maluco na TV, Community, It’s Always Sunny in Philadelphia", "episodio": "", "texto": ["Michael Bluth (Jason Bateman) é o único adulto da família: quando o pai, dono de uma construtora, é preso por fraude, ele precisa administrar o que sobrou — a empresa, a mansão que está sendo perdida, uma mãe manipuladora, uma irmã mimada, um irmão mágico e um filho adolescente. Narrada por Ron Howard e filmada como um documentário, a série de Mitchell Hurwitz é construída em camadas: frases viram piada três episódios depois, e um detalhe no fundo da tela explica uma cena anterior. Quem vê duas vezes ri mais.", "Foi cancelada pela Fox depois de três temporadas, ganhou fama de “série de culto” e foi ressuscitada pela Netflix em 2013 e 2018, e na quarta temporada a estrutura ficou ainda mais intrincada: cada episódio mostra o mesmo período pelo ponto de vista de um personagem diferente."]}}, {"rank": 13, "nyt": "Girls", "anos": "2012–2017", "pt": "Girls", "alt": "", "ficha": {"tagline": "Quatro amigas em Nova York descobrem que ser adulta é difícil e raramente elegante.", "genero": "Comédia dramática", "pais": "Estados Unidos", "anos": "2012–2017 · 6 temporadas", "elenco": "Lena Dunham, Allison Williams, Jemima Kirke, Zosia Mamet, Adam Driver, Alex Karpovsky", "emissora": "HBO", "premios": "Globo de Ouro de melhor série de comédia e de melhor atriz de comédia (Lena Dunham), em 2013.", "parecido": "Sex and the City, Fleabag, Broad City – A Cidade das Minas", "episodio": "“One Man’s Trash” (2ª temporada, ep. 5).", "texto": ["Hannah Horvath (Lena Dunham) é uma aspirante a escritora de 24 anos que acaba de ser cortada da mesada pelos pais. Mora no Brooklyn, tem um emprego mal pago e um relacionamento confuso com Adam (Adam Driver), e divide o tempo com as amigas Marnie, Jessa e Shoshanna. Dunham, que criou a série, escreveu e dirigiu vários episódios, usa o desconforto — físico, financeiro, amoroso — como matéria-prima da comédia e não poupa as personagens: elas são egoístas, imaturas e, às vezes, difíceis de querer bem.", "Foi aplaudida e criticada na mesma medida: de um lado, a ousadia de mostrar corpos e sexo sem glamour; de outro, a pouca diversidade do elenco e do ambiente retratado. Os dois lados da discussão fazem parte do que a série significa. Vista hoje, é um retrato muito preciso de uma geração que chegou à vida adulta no meio da crise econômica."]}}, {"rank": 14, "nyt": "Friday Night Lights", "anos": "2006–2011", "pt": "Tudo Pela Vitória", "alt": "", "ficha": {"tagline": "O futebol americano é a religião de uma cidade pequena do Texas — e o técnico, um profeta cansado.", "genero": "Drama", "pais": "Estados Unidos", "anos": "2006–2011 · 5 temporadas", "elenco": "Kyle Chandler, Connie Britton, Taylor Kitsch, Zach Gilford, Minka Kelly, Jesse Plemons, Michael B. Jordan, Adrianne Palicki", "emissora": "NBC (as últimas temporadas também passaram pelo canal DirecTV)", "premios": "Emmys de melhor ator (Kyle Chandler) e de roteiro, em 2011; prêmio Peabody em 2007.", "parecido": "Parenthood, This Is Us", "episodio": "", "texto": ["Dillon, no interior do Texas, vive de sexta-feira à noite: o time de futebol americano do colégio é motivo de orgulho, de apostas e de pressão sobre garotos de dezessete anos. Quando o técnico Eric Taylor (Kyle Chandler) assume a equipe, passa a carregar as expectativas de toda a comunidade, ao lado da mulher, Tami (Connie Britton), orientadora do colégio. A série foi inspirada no livro-reportagem de H. G. Bissinger e no filme que ele gerou.", "O esporte é só o ponto de partida. A câmera na mão, os diálogos meio improvisados e os atores pouco conhecidos criam uma sensação de realidade rara na TV, e os temas reais — dinheiro, classe social, racismo, o peso de crescer numa cidade pequena — dão a ela uma emoção honesta, sem apelação. Nunca foi um sucesso de audiência, mas conquistou uma legião de fãs fiéis e uma das melhores reputações entre as séries dramáticas da década."]}}, {"rank": 15, "nyt": "Six Feet Under", "anos": "2001–2005", "pt": "A Sete Palmos", "alt": "Sete Palmos de Terra (Portugal)", "ficha": {"tagline": "Uma funerária de família e o que a morte ensina sobre como viver.", "genero": "Drama", "pais": "Estados Unidos", "anos": "2001–2005 · 5 temporadas", "elenco": "Peter Krause, Michael C. Hall, Frances Conroy, Lauren Ambrose, Rachel Griffiths, Freddy Rodriguez", "emissora": "HBO", "premios": "Nove Emmys e vários Globos de Ouro.", "parecido": "Família Soprano, Breaking Bad, Dexter", "episodio": "", "texto": ["Criada por Alan Ball, roteirista de Beleza Americana, a série acompanha os Fisher, que tocam uma funerária em Los Angeles. Nate (Peter Krause) volta para casa para o enterro do pai e acaba ficando; David (Michael C. Hall), o irmão fechado, esconde que é gay; a mãe, Ruth, tenta aprender a viver de novo; e a caçula, Claire, só quer fugir. Todo episódio começa com a morte de alguém — um cliente da funerária — e usa o velório para fazer os vivos olharem para as próprias escolhas.", "A premissa pode soar macabra, mas o tom é muito humano, com humor seco e várias cenas de desabar. A série consolidou a HBO como lugar de histórias adultas e complexas e abriu caminho para muitos dramas de personagens que vieram depois. O último episódio é um dos mais comentados da história da televisão."]}}, {"rank": 16, "nyt": "The Office (U.K.)", "anos": "2001–2003", "pt": "The Office (Reino Unido)", "alt": "The Office - A Empresa (Portugal)", "ficha": {"tagline": "O pior chefe do mundo, observado por uma câmera de documentário que não perdoa nada.", "genero": "Comédia (falso documentário)", "pais": "Reino Unido", "anos": "2001–2003 · 2 temporadas e um especial de Natal", "elenco": "Ricky Gervais, Martin Freeman, Mackenzie Crook, Lucy Davis, Ewen MacIntosh", "emissora": "BBC Two", "premios": "Vários BAFTAs e dois Globos de Ouro (2004), de melhor série de comédia e melhor ator de comédia para Ricky Gervais.", "parecido": "The Office (EUA), Extras, The Thick of It", "episodio": "O especial de Natal (2003).", "texto": ["Em Slough, cidade-dormitório inglesa, a empresa de papel Wernham Hogg é dirigida por David Brent (Ricky Gervais), que se acha um chefe-amigo, comediante nato e filósofo — e nunca percebe como os outros o veem. Uma equipe de documentário acompanha o dia a dia do escritório. Em apenas doze episódios e um especial de Natal, a série de Gervais e Stephen Merchant criou uma linguagem: câmeras que se demoram nos olhares, silêncios que qualquer sitcom cortaria, constrangimento levado ao limite.", "Por baixo da comédia, há uma história de amor discreta e comovente — entre o vendedor Tim (Martin Freeman) e a recepcionista Dawn (Lucy Davis) — e uma crônica sobre empregos que ninguém escolheu. O formato foi refeito em dezenas de países, mas o original segue como referência."]}}, {"rank": 17, "nyt": "The Americans", "anos": "2013–2018", "pt": "The Americans: Rede de Espionagem", "alt": "", "ficha": {"tagline": "Um casal de classe média que adora o bairro, os filhos e a agência de viagens — e trabalha para a KGB.", "genero": "Drama de espionagem", "pais": "Estados Unidos", "anos": "2013–2018 · 6 temporadas", "elenco": "Keri Russell, Matthew Rhys, Noah Emmerich, Margo Martindale, Holly Taylor, Alison Wright, Frank Langella", "emissora": "FX", "premios": "Emmys de melhor ator (Matthew Rhys) e de melhor roteiro, em 2018.", "parecido": "Homeland: Segurança Nacional, Mad Men: Inventando Verdades, Slow Horses", "episodio": "", "texto": ["No início dos anos 1980, os Jennings parecem a família americana ideal. Na verdade, Philip e Elizabeth são agentes soviéticos infiltrados nos Estados Unidos há anos e, enquanto a Guerra Fria esquenta sob o governo Reagan, cumprem missões em Washington. Criada por Joe Weisberg, ex-agente da CIA, a série interessa-se menos por tiroteios do que pelo custo da vida dupla: o casamento arranjado pela KGB que se torna amor de verdade, os filhos que podem descobrir a verdade, o vizinho que trabalha no FBI.", "A tensão nasce do cotidiano e do dilema moral de torcer por quem faz coisas condenáveis. A reconstituição da época — figurino, trilha, as perucas memoráveis — é caprichada, e o elenco de apoio é ótimo, em especial Margo Martindale. A série terminou de forma coerente e cuidadosa, o que não é comum."]}}, {"rank": 18, "nyt": "I May Destroy You", "anos": "2020", "pt": "I May Destroy You", "alt": "", "ficha": {"tagline": "Depois de uma noite que não consegue lembrar, uma escritora tenta entender o que lhe fizeram — e o que fazer com isso.", "genero": "Drama", "pais": "Reino Unido", "anos": "2020 · minissérie de 12 episódios", "elenco": "Michaela Coel, Paapa Essiedu, Weruche Opia, Stephen Wight, Harriet Webb", "emissora": "BBC One (Reino Unido) e HBO (Estados Unidos)", "premios": "Emmy de melhor roteiro de minissérie e dois BAFTAs de TV (melhor minissérie e melhor atriz), em 2021.", "parecido": "Fleabag, Normal People, Girls", "episodio": "", "texto": ["Arabella é uma jovem escritora londrina, de sucesso nas redes sociais, que sai com amigos e acorda sem lembrar do que aconteceu. Aos poucos, vai reconstituindo a noite e reconhecendo que foi vítima de violência sexual. Michaela Coel, que criou, escreveu e protagoniza a série, inspirou-se em experiência própria, e isso se sente na precisão com que o programa trata memória, culpa, consentimento e justiça.", "A série vai além do trauma: acompanha amizades, carreira, desejo, o mundo digital e as questões de raça, e é engraçada onde menos se espera. Os episódios mudam de tom com frequência, e o resultado é um retrato complexo e muito humano de alguém que se recusa a ser definido pelo que lhe fizeram. Atenção: trata de violência sexual de forma direta."]}}, {"rank": 19, "nyt": "Chernobyl", "anos": "2019", "pt": "Chernobyl", "alt": "", "ficha": {"tagline": "A explosão que o governo soviético tentou esconder — e as pessoas que a enfrentaram.", "genero": "Drama histórico (minissérie)", "pais": "Estados Unidos e Reino Unido", "anos": "2019 · minissérie de 5 episódios", "elenco": "Jared Harris, Stellan Skarsgård, Emily Watson, Jessie Buckley, Paul Ritter, Con O’Neill", "emissora": "HBO (em coprodução com a Sky)", "premios": "Emmys de melhor minissérie, direção e roteiro (2019); Globo de Ouro e BAFTA de melhor minissérie.", "parecido": "Irmãos de Guerra, Dopesick", "episodio": "", "texto": ["Em abril de 1986, durante um teste de segurança, um dos reatores da usina de Chernobyl, na Ucrânia — então parte da União Soviética —, explode. Escrita por Craig Mazin, a minissérie reconstitui as horas e os meses seguintes: os bombeiros que entram no prédio sem saber o que os espera, o físico Valery Legasov (Jared Harris), que tenta convencer o Partido de que o desastre é maior do que se admite, e os mineiros e soldados chamados para conter o estrago.", "O foco está menos na catástrofe do que na mentira: como um sistema que não admite falhar tornou o acidente ainda pior. São cinco episódios sem heróis de cartaz, com reconstituição de época de arrepiar e a trilha sonora de Hildur Guðnadóttir. A série toma liberdades dramáticas — alguns personagens, como a cientista Ulana Khomyuk, são compostos a partir de várias pessoas reais."]}}, {"rank": 20, "nyt": "The Crown", "anos": "2016–2023", "pt": "The Crown", "alt": "", "ficha": {"tagline": "Seis décadas de reinado, contadas pelos bastidores do Palácio de Buckingham.", "genero": "Drama histórico", "pais": "Reino Unido e Estados Unidos", "anos": "2016–2023 · 6 temporadas", "elenco": "Claire Foy, Olivia Colman, Imelda Staunton, Matt Smith, Tobias Menzies, Jonathan Pryce, Vanessa Kirby, Helena Bonham Carter, Emma Corrin, Elizabeth Debicki", "emissora": "Netflix", "premios": "Emmy de melhor série dramática (2021) e Globo de Ouro de melhor série dramática (2017 e 2021).", "parecido": "Downton Abbey, Peaky Blinders", "episodio": "", "texto": ["Criada por Peter Morgan, que já havia escrito o filme A Rainha, a série cobre o reinado de Elizabeth II, do casamento com Philip, em 1947, até meados dos anos 2000, em ciclos de duas temporadas, cada um com um elenco novo que envelhece junto com as personagens. O drama alterna os assuntos de Estado — crises políticas, a convivência com sucessivos primeiros-ministros — e as questões de família: o casamento de Margaret, a rotina de Philip, o casamento de Charles e Diana.", "É ficção: muitas conversas íntimas são imaginadas, e a série foi criticada justamente por isso. Mas a produção — locações, figurino, atuações — é de primeiríssima linha, e cada temporada ganha tom próprio, às vezes mais político, às vezes mais íntimo. Vale ver como entretenimento de época, não como livro de história."]}}, {"rank": 21, "nyt": "The White Lotus", "anos": "2021–hoje", "pt": "The White Lotus", "alt": "", "ficha": {"tagline": "Férias de luxo, hóspedes ricos e uma tensão que nunca descansa.", "genero": "Comédia dramática de suspense (sátira social)", "pais": "Estados Unidos", "anos": "2021 em diante · 3 temporadas até 2025", "elenco": "Jennifer Coolidge, Murray Bartlett, Connie Britton, Sydney Sweeney, Natasha Rothwell, Aubrey Plaza, Theo James, Michelle Monaghan, Walton Goggins, Carrie Coon (o elenco muda a cada temporada)", "emissora": "HBO", "premios": "Vários Emmys em 2022, incluindo melhor minissérie e melhor atriz coadjuvante (Jennifer Coolidge).", "parecido": "Succession, Big Little Lies, Mare of Easttown", "episodio": "", "texto": ["Cada temporada se passa num resort de luxo da rede fictícia White Lotus, num lugar diferente — Havaí, Sicília, Tailândia —, com um novo grupo de hóspedes e funcionários e uma morte anunciada logo de início, sem que se saiba quem é a vítima. Criada por Mike White, é uma sátira de ricos que não escutam ninguém e de empregados que precisam sorrir o tempo todo, com diálogos que provocam riso pelo desconforto.", "O suspense é o pretexto; o assunto de verdade é dinheiro, desigualdade e as formas pelas quais gente privilegiada consegue estragar o dia dos outros sem notar. A personagem de Jennifer Coolidge, a trágica e hilária Tanya, virou a figura mais querida da série. Cada temporada pode ser vista separadamente."]}}, {"rank": 22, "nyt": "Lost", "anos": "2004–2010", "pt": "Lost", "alt": "Perdidos (Portugal)", "ficha": {"tagline": "Sobreviventes de um acidente aéreo numa ilha onde nada é o que parece.", "genero": "Drama de mistério e ficção científica", "pais": "Estados Unidos", "anos": "2004–2010 · 6 temporadas", "elenco": "Matthew Fox, Evangeline Lilly, Josh Holloway, Terry O’Quinn, Jorge Garcia, Naveen Andrews, Daniel Dae Kim, Yunjin Kim, Michael Emerson, Elizabeth Mitchell", "emissora": "ABC", "premios": "Emmy de melhor série dramática em 2005, entre outros prêmios.", "parecido": "The Leftovers, Fringe, Dark", "episodio": "", "texto": ["Um voo de Sydney para Los Angeles cai numa ilha do Pacífico. Alguns passageiros morrem, outros resistem, e logo descobrem que o lugar guarda segredos: uma criatura de fumaça, sinais de rádio de décadas atrás, uma escotilha misteriosa, uma sequência de números que reaparece e grupos de habitantes hostis. Cada episódio mistura o presente na ilha com cenas do passado dos personagens (e, mais tarde, do futuro), e as histórias se cruzam de maneiras que só fazem sentido depois.", "Criada por J. J. Abrams, Damon Lindelof e Jeffrey Lieber, foi um fenômeno mundial e criou o hábito de discutir teorias a cada semana, antes das redes sociais. O desfecho dividiu os fãs, mas a série mudou o jeito de contar histórias longas na TV e abriu caminho para muitas outras."]}}, {"rank": 23, "nyt": "The Comeback", "anos": "2005–2026", "pt": "The Comeback", "alt": "", "ficha": {"tagline": "Uma atriz de sitcom esquecida deixa as câmeras mostrarem tudo — inclusive o que ela queria esconder.", "genero": "Comédia (falso documentário)", "pais": "Estados Unidos", "anos": "2005–2026 · 3 temporadas (2005, 2014 e 2026)", "elenco": "Lisa Kudrow, Dan Bucatinsky, Damian Young, Laura Silverman, Robert Michael Morris", "emissora": "HBO", "premios": "Poucos prêmios; a 2ª temporada rendeu a Lisa Kudrow uma indicação ao Emmy (2015). Hoje é considerada uma das comédias mais influentes de sua época.", "parecido": "Curb Your Enthusiasm, Hacks, Um Maluco na TV", "episodio": "", "texto": ["Valerie Cherish foi estrela de uma sitcom nos anos 1990 e agora aceita, quase de joelhos, um papel de coadjuvante numa comédia nova. Uma equipe de reality show registra seu retorno à TV, e, quando a câmera está ligada, ela insiste em sorrir, mesmo nos momentos mais humilhantes. Lisa Kudrow, a Phoebe de Friends, criou a série com Michael Patrick King (Sex and the City) e deu à personagem uma vaidade comovente e um talento desastroso para o constrangimento.", "Estreou em 2005, foi cancelada após uma temporada e só foi valorizada anos depois, quando a cultura do reality show e da fama instantânea passou a funcionar exatamente como ela previa. Voltou em 2014 e, em 2026, para uma terceira e última temporada. É uma comédia de constrangimento com um coração triste, sobre fama, envelhecimento e a vontade de ser vista."]}}, {"rank": 24, "nyt": "Deadwood", "anos": "2004–2006", "pt": "Deadwood", "alt": "", "ficha": {"tagline": "O Velho Oeste como ele realmente era: sujo, violento e muito falador.", "genero": "Faroeste", "pais": "Estados Unidos", "anos": "2004–2006 · 3 temporadas (mais um filme em 2019)", "elenco": "Timothy Olyphant, Ian McShane, Molly Parker, Brad Dourif, Robin Weigert, Paula Malcomson, Jim Beaver", "emissora": "HBO", "premios": "Globo de Ouro de melhor ator (Ian McShane, 2005) e Emmys, entre eles o de direção (Walter Hill, 2005).", "parecido": "A Escuta, Justified, Peaky Blinders", "episodio": "", "texto": ["Deadwood, no território de Dakota, em 1876, é um acampamento de mineradores que existe fora da lei americana e cresce a cada semana. O criador, David Milch, mistura figuras reais — o pistoleiro Wild Bill Hickok, Calamity Jane — com personagens inventados. O eixo da história é a relação entre o xerife Seth Bullock (Timothy Olyphant), que chegou para ganhar dinheiro e acabou virando homem da lei, e Al Swearengen (Ian McShane), dono do saloon The Gem, que quer manter o controle da cidade.", "O que mais chama atenção é a linguagem: diálogos longos, floridos e carregados de palavrões, com um ritmo quase shakespeariano, num cenário de lama e sujeira. A série foi cancelada com a trama em aberto e só em 2019 ganhou um filme de fechamento."]}}, {"rank": 25, "nyt": "The Leftovers", "anos": "2014–2017", "pt": "The Leftovers", "alt": "", "ficha": {"tagline": "Dois por cento da humanidade desaparece sem explicação; quem ficou tenta entender como seguir.", "genero": "Drama de mistério", "pais": "Estados Unidos", "anos": "2014–2017 · 3 temporadas", "elenco": "Justin Theroux, Carrie Coon, Amy Brenneman, Christopher Eccleston, Liv Tyler, Ann Dowd, Margaret Qualley, Scott Glenn, Regina King", "emissora": "HBO", "premios": "Sem grandes prêmios, mas aparece com frequência em listas das melhores séries da década.", "parecido": "Lost, Dark, Station Eleven", "episodio": "", "texto": ["Num instante, duas em cada cem pessoas do planeta somem sem deixar rastro. Três anos depois, na pequena cidade de Mapleton, o chefe de polícia Kevin Garvey (Justin Theroux) tenta manter a ordem enquanto surgem seitas — uma delas, os “Remanescentes Culpados”, vestida de branco, silenciosa e decidida a não deixar ninguém esquecer a perda. A série foi criada por Damon Lindelof, de Lost, e Tom Perrotta, autor do romance que a inspirou.", "Ao contrário de Lost, a série não se interessa por explicar o desaparecimento. Seu assunto é o luto: o que se faz com uma perda sem resposta, como as pessoas se apegam a rituais e crenças para suportar a dor. A primeira temporada é <script>
"use strict";
const D = JSON.parse(document.getElementById('dados').textContent);
const ITEMS = D.items;
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---- marcações do leitor (ficam só neste navegador) ---- */
const KEY='nyt100-br:v1';
let ST={};
try{ST=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){ST={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
const get=(r,k)=>!!(ST[r]&&ST[r][k]);
function setv(r,k,v){ST[r]=ST[r]||{};if(v)ST[r][k]=v;else delete ST[r][k];if(!Object.keys(ST[r]).length)delete ST[r];save();}

/* ---- filtros ---- */
const FILTERS=[
 ['todos','Todos',()=>true],
 ['ficha','Com ficha',i=>!!i.ficha],
 ['nvi','Ainda não vi',i=>!get(i.rank,'v')],
 ['vi','Já vi',i=>get(i.rank,'v')],
 ['qv','Quero ver',i=>get(i.rank,'q')],
];
let filt='todos', query='', sel=1;
const chips=$('#chips');
FILTERS.forEach(([id,label])=>{const b=document.createElement('button');b.className='chip';b.dataset.f=id;b.textContent=label;b.setAttribute('aria-pressed',id===filt);
  b.onclick=()=>{filt=id;[...chips.children].forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===filt));renderList()};chips.appendChild(b)});

const hay = i => norm([i.rank,i.pt,i.nyt,i.alt,i.anos,i.ficha&&[i.ficha.tagline,i.ficha.genero,i.ficha.pais,i.ficha.elenco,i.ficha.emissora,i.ficha.parecido,i.ficha.texto.join(' ')].join(' ')].join(' '));
ITEMS.forEach(i=>i._h=hay(i));

function visible(){
  const f=FILTERS.find(x=>x[0]===filt)[2], q=norm(query).trim();
  return ITEMS.filter(i=>f(i)&&(!q||i._h.includes(q)));
}

/* ---- lista ---- */
function renderList(){
  const v=visible(), box=$('#rows');
  if(!v.length){box.innerHTML='<div class="empty">Nenhum programa neste filtro.</div>';counts();return}
  box.innerHTML=v.map(i=>`
   <div class="row" role="option" tabindex="-1" data-r="${i.rank}" aria-selected="${i.rank===sel}">
     <span class="rk">${i.rank}</span>
     <span class="tt"><span class="pt">${esc(i.pt)}</span>${i.pt!==i.nyt?`<span class="en">${esc(i.nyt)}</span>`:''}<span class="yr">${esc(i.anos)}</span>${i.ficha?'<span class="stamp" title="Tem ficha e resenha">ficha</span>':''}</span>
     <input type="checkbox" data-k="v" aria-label="Já vi: ${esc(i.pt)}" ${get(i.rank,'v')?'checked':''}>
     <input type="checkbox" data-k="q" aria-label="Quero ver: ${esc(i.pt)}" ${get(i.rank,'q')?'checked':''}>
   </div>`).join('');
  counts();
}
$('#rows').addEventListener('click',e=>{
  const row=e.target.closest('.row'); if(!row) return;
  const r=+row.dataset.r;
  if(e.target.matches('input[type=checkbox]')){setv(r,e.target.dataset.k,e.target.checked);syncDetailChecks(r);counts();return}
  select(r,true);
});
function counts(){
  const n=ITEMS.length;
  const v=ITEMS.filter(i=>get(i.rank,'v')).length, q=ITEMS.filter(i=>get(i.rank,'q')).length;
  $('#counts').innerHTML=`<span><b>${v}</b> de ${n} vistos</span><span><b>${q}</b> quero ver</span><span>mostrando <b>${visible().length}</b></span>`;
  $('#barfill').style.width=(v/n*100)+'%';
}

/* ---- detalhe ---- */
function f(dt,dd){return dd?`<dt>${dt}</dt><dd>${dd}</dd>`:''}
function select(r,open){
  sel=r; const i=ITEMS.find(x=>x.rank===r); if(!i) return;
  [...document.querySelectorAll('.row')].forEach(el=>el.setAttribute('aria-selected',+el.dataset.r===r));
  const F=i.ficha;
  const sub=[i.pt!==i.nyt?`Título original: ${esc(i.nyt)}`:'', esc(i.anos)].filter(Boolean).join(' · ');
  let h=`<div class="nav"><button class="btn backbtn" id="back">← lista</button><button class="btn" id="prev">← anterior</button><button class="btn" id="next">próximo →</button></div>
   <div class="d-rank">Nº ${i.rank} DE 100 · NYT</div>
   <h2 class="d-title">${esc(i.pt)}</h2>
   <p class="d-sub">${sub}</p>
   ${F?`<p class="tagline">${esc(F.tagline)}</p>`:''}
   <div class="card"><h3><span>Minhas marcações</span><span id="ckst"></span></h3>
    <div class="checks">
     <label><input type="checkbox" data-k="v" ${get(i.rank,'v')?'checked':''}> Já vi</label>
     <label><input type="checkbox" data-k="q" ${get(i.rank,'q')?'checked':''}> Quero ver</label>
    </div>
    <textarea class="note" id="note" placeholder="Anotação pessoal…" aria-label="Anotação">${esc((ST[i.rank]||{}).n||'')}</textarea>
   </div>`;
  if(F){
    h+=`<div class="card"><h3><span>Ficha</span></h3><dl class="f">
      ${f('Gênero',esc(F.genero))}${f('País',esc(F.pais))}${f('Exibição',esc(F.anos))}${f('Elenco',esc(F.elenco))}
      ${f('Emissora original',esc(F.emissora))}${f('Prêmios',esc(F.premios))}${f('Para quem gosta de',esc(F.parecido))}${f('Episódio de destaque',esc(F.episodio))}${f('Também conhecida como',esc(i.alt))}
     </dl></div>
     <div class="card"><h3><span>Sobre a série</span></h3><div class="txt">${F.texto.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>`;
  }else{
    h+=`<div class="card"><h3><span>Sobre a série</span></h3><div class="none"><b>Ficha em preparação.</b><br>Por enquanto esta página traz só a posição na lista do NYT, o título e os anos de exibição.${i.alt?`<br><br>Também conhecida como: ${esc(i.alt)}.`:''}</div></div>`;
  }
  $('#detail').innerHTML=h;
  $('#detail').scrollTop=0; if(open){document.body.classList.add('showdetail');window.scrollTo(0,0)}
  try{history.replaceState(null,'','#'+r)}catch(e){}
  ckst(i.rank);
}
function ckst(r){const el=$('#ckst'); if(el) el.textContent=[get(r,'v')?'visto':'',get(r,'q')?'quero ver':''].filter(Boolean).join(' · ')}
$('#detail').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='back') document.body.classList.remove('showdetail');
  else if(t.id==='prev') step(-1); else if(t.id==='next') step(1);
});
$('#detail').addEventListener('change',e=>{
  if(e.target.matches('input[type=checkbox][data-k]')){setv(sel,e.target.dataset.k,e.target.checked);const row=$(`.row[data-r="${sel}"] input[data-k="${e.target.dataset.k}"]`);if(row)row.checked=e.target.checked;ckst(sel);counts();if(['nvi','vi','qv'].includes(filt))renderList()}
});
$('#detail').addEventListener('input',e=>{if(e.target.id==='note'){setv(sel,'n',e.target.value.trim()?e.target.value:'')}});
function syncDetailChecks(r){if(r!==sel)return;document.querySelectorAll('#detail .checks input').forEach(c=>c.checked=get(r,c.dataset.k));ckst(r)}
function step(d){const v=visible();const k=v.findIndex(x=>x.rank===sel);const n=v[Math.min(v.length-1,Math.max(0,k+d))];if(n){select(n.rank);const row=$(`.row[data-r="${n.rank}"]`);if(row)row.scrollIntoView({block:'nearest'})}}

/* ---- busca, atalhos ---- */
$('#q').addEventListener('input',e=>{query=e.target.value;renderList()});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
  if(e.key==='/'&&!typing){e.preventDefault();$('#q').focus();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='j'||e.key==='ArrowDown'){e.preventDefault();step(1)}
  else if(e.key==='k'||e.key==='ArrowUp'){e.preventDefault();step(-1)}
  else if(e.key==='Escape'){document.body.classList.remove('showdetail')}
});

/* ---- exportar / importar marcações ---- */
function download(name,mime,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
$('#btnExport').onclick=()=>download('nyt100-marcacoes.json','application/json',JSON.stringify({versao:1,estado:ST},null,1));
$('#btnImport').onclick=()=>$('#fileImport').click();
$('#fileImport').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o&&o.estado&&typeof o.estado==='object'){ST=o.estado;save();renderList();select(sel)}else alert('Arquivo inválido.')}catch(x){alert('Arquivo inválido.')}});e.target.value=''};

/* ---- rodapé ---- */
$('#foot').innerHTML=D.rodape.map(p=>`<p>${esc(p)}</p>`).join('');

/* ---- início ---- */
renderList();
const h0=parseInt((location.hash||'').slice(1),10);
select(ITEMS.some(i=>i.rank===h0)?h0:1,false);
window.addEventListener('hashchange',()=>{const h=parseInt((location.hash||'').slice(1),10); if(ITEMS.some(i=>i.rank===h)&&h!==sel) select(h,false);});
</script>
</body>
</html>
